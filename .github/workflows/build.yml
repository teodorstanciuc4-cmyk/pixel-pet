name: Build AltStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Create Source Code & Config
        run: |
          mkdir -p PixelCompanion

          cat << 'EOF' > PixelCompanion/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>PixelCompanion</string>
              <key>CFBundleIdentifier</key>
              <string>com.pixel.companion</string>
              <key>CFBundleName</key>
              <string>PixelCompanion</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > PixelCompanion/App.swift
          import SwiftUI
          import WebKit

          @main
          struct PixelCompanionApp: App {
              var body: some Scene {
                  WindowGroup {
                      CompanionWebView().edgesIgnoringSafeArea(.all)
                  }
              }
          }

          struct CompanionWebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.07, green: 0.09, blue: 0.12, alpha: 1.0)
                  webView.scrollView.isScrollEnabled = false
                  let html = """
                  <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"><style>*{box-sizing:border-box;margin:0;padding:0;}body{background:#11151c;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;overflow:hidden;}#pip-btn{position:absolute;top:60px;background:#00d592;color:#0b1118;border:none;padding:12px 24px;border-radius:30px;font-weight:800;font-size:15px;z-index:100;}canvas#petCanvas{image-rendering:pixelated;border-radius:16px;}#pipVideo{position:absolute;opacity:0;width:1px;height:1px;}</style></head><body><button id="pip-btn">📲 Put Companion on Wallpaper</button><canvas id="petCanvas" width="300" height="300"></canvas><video id="pipVideo" playsinline muted autoplay></video><script>const C={_:'transparent',K:'#2b2d35',G:'#1b6953',M:'#00d592',L:'#a4fb6c',P:'#d7aaff',W:'#ffffff',F:'#fec38b',T:'#ff6c8b',H:'#ff267d',B:'#00ffa6'};const baseSprite=["____KPPK____KPPK","____KWWK____KWWK","____KWKK____KWKK","___KMMMMMMMMMMMK","__KGGMMMMMMMMMMK","_KGGMKMKMMKMKMMK","_KGGMMMMMMMMMMMK","_KGGKTFFFFFFTKKK","_KGGKFFFFFFFFMKK","_KGKFFKFFFFKFFMK","_KGKFFFFKKFFFFMK","_KGKTFFFFFFFFTMK","KKGGKLLLLLLLLMKK","KGGGKLLHHLLLLMKK","KKGGKLHHHHHLLMKK","_KGKKLHHHHHLLMKK","__KK_KLHHHLLMKK_","______KLLLLMK___","_____KBBM_KBBM__","_____KKKK_KKKK__"];const canvas=document.getElementById('petCanvas'),ctx=canvas.getContext('2d'),pixelSize=9;let animState='idle',frameTick=0,bounceY=0,bubbleText="Ribbit! Let's conquer today!",bubbleVisible=true,bubbleTimer=150,fly={active:false,x:20,y:120,targetX:130,targetY:170};setInterval(()=>{if(Math.random()<0.5){fly.active=true;fly.x=10;fly.y=120;}else{bubbleText="Did you practice today?";bubbleVisible=true;bubbleTimer=140;}},16000);function draw(){frameTick++;bounceY=Math.sin(frameTick*0.1)*3;ctx.fillStyle='#161c24';ctx.fillRect(0,0,canvas.width,canvas.height);const xOffset=78,yOffset=85+bounceY;for(let r=0;r<baseSprite.length;r++){for(let c=0;c<baseSprite[0].length;c++){let char=baseSprite[r][c];if(char==='H'&&(frameTick%12<4))char='W';if(C[char]&&C[char]!=='transparent'){ctx.fillStyle=C[char];ctx.fillRect(xOffset+c*pixelSize,yOffset+r*pixelSize,pixelSize,pixelSize);}}}if(bubbleVisible){bubbleTimer--;if(bubbleTimer<=0)bubbleVisible=false;ctx.fillStyle='#fff';ctx.fillRect(20,20,260,50);ctx.fillStyle='#000';ctx.font='bold 12px sans-serif';ctx.fillText(bubbleText,35,50);}}setInterval(draw,1000/30);const pipBtn=document.getElementById('pip-btn'),pipVideo=document.getElementById('pipVideo');pipBtn.onclick=async()=>{const stream=canvas.captureStream(30);pipVideo.srcObject=stream;await pipVideo.play();if(pipVideo.webkitSetPresentationMode)pipVideo.webkitSetPresentationMode('picture-in-picture');};</script></body></html>
                  """
                  webView.loadHTMLString(html, baseURL: nil)
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }
          EOF

          cat << 'EOF' > project.yml
          name: PixelCompanion
          options:
            bundleIdPrefix: com.pixel
          targets:
            PixelCompanion:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [PixelCompanion]
              info:
                path: PixelCompanion/Info.plist
          EOF

      - name: Generate Xcode Project & Build IPA
        run: |
          brew install xcodegen
          xcodegen generate

          xcodebuild -project PixelCompanion.xcodeproj \
            -scheme PixelCompanion \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/PixelCompanion.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p Payload
          cp -r build/PixelCompanion.xcarchive/Products/Applications/PixelCompanion.app Payload/
          zip -r PixelCompanion.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelCompanion-IPA
          path: PixelCompanion.ipa
