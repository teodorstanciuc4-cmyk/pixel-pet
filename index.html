       1. UNDERTALE RETRO THEME STYLING
       ========================================================================= */

      padding: 0;

      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;

      background-color: var(--ut-bg);
      color: #ffffff;
      font-family: var(--ut-font);

      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 8px 60px 8px;
      overflow-x: hidden;

    /* Scanline effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);

      z-index: 999;
      pointer-events: none;

      max-width: 420px;
      margin-bottom: 8px;

      align-items: center;
      border: 3px solid var(--ut-border);
      padding: 8px 10px;
      font-size: 0.52rem;

  <script>
    /* =========================================================================
       1. SYNTHESIZED UNDERTALE AUDIO ENGINE (Web Audio API)
       ========================================================================= */
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // Iconic retro speech blip sound
    function playSpeechBlip() {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // 8-bit square wave with slight frequency modulation
        osc.type = 'square';
        osc.frequency.setValueAtTime(140 + Math.random() * 20, ctx.currentTime);

        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    // Menu button beep
    function playBeep(freq = 440) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    /* =========================================================================
       2. REAL-TIME CLOCKS & SUNDAY DEADLINE SYNCHRONIZATION
       ========================================================================= */
    function syncClocks() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-display').innerText = `${hh}:${mm}:${ss}`;

      // Calculate Sunday Midnight
      const day = now.getDay();
      const daysLeft = (7 - day) % 7;
      const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysLeft, 23, 59, 59);
      const diff = sunday - now;

      if (diff > 0) {
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById('deadline-display').innerText = `${d}d ${h}h`;
      } else {
        document.getElementById('deadline-display').innerText = `EXPIRED!`;
      }
    }
    setInterval(syncClocks, 1000);
    syncClocks();

      "Accusation Cleansers", "Persuasion Primes", "Vulnerability Wedges", "Impression Facades", "Insulation Controls", "System Synthesis"
    ];

    const CORPUS = TOPIC_NAMES.map((name, i) => ({

`[RAW CONVERSATION INPUT]

[PRIMARY STRUCTURAL METRIC?]

      {
        face: "shock",
        text: "* Look at this room. You gave me a desk, a lamp, and an 8-bit SOUL. What is the catch here?",
        c1: "No catch, you're my buddy.",
        r1: "* Buddy? That's an interesting neurochemical bond. I suppose I accept this collaboration.",
        c2: "You have to help me study.",
        r2: "* A fair transaction! Let's examine this week's flowchart framework."
      }
    ];

    let currentConvoIdx = 0;
    let isTyping = false;
    let typeTimer = null;

    function setFrogFace(faceType) {
      document.getElementById('face-neutral').style.display = 'none';
      document.getElementById('face-wink').style.display = 'none';
      document.getElementById('face-shock').style.display = 'none';
      document.getElementById('face-think').style.display = 'none';

      if (faceType === 'wink') document.getElementById('face-wink').style.display = 'block';
      else if (faceType === 'shock') document.getElementById('face-shock').style.display = 'block';
      else if (faceType === 'think') document.getElementById('face-think').style.display = 'block';
      else document.getElementById('face-neutral').style.display = 'block';
    }

    function typeWriterText(text, callback) {
      const target = document.getElementById("dialogue-text-target");
      target.innerHTML = "";
      clearTimeout(typeTimer);
      isTyping = true;
      let i = 0;

      function step() {
        if (i < text.length) {
          target.innerHTML += text.charAt(i);
          // Play retro speech sound on alphanumeric characters
          if (/[a-zA-Z0-9]/.test(text.charAt(i))) {
            playSpeechBlip();
          }
          i++;
          typeTimer = setTimeout(step, 24);
        } else {
          isTyping = false;
          if (callback) callback();
        }
      }
      step();
    }

    function triggerConvo(idx) {
      currentConvoIdx = idx % CONVERSATIONS.length;
      const convo = CONVERSATIONS[currentConvoIdx];
      const choicesBox = document.getElementById("choices-box");
      choicesBox.style.display = "none";

      setFrogFace(convo.face);

      typeWriterText(convo.text, () => {
        document.getElementById("choice-1").innerText = convo.c1;
        document.getElementById("choice-2").innerText = convo.c2;
        choicesBox.style.display = "flex";
      });
    }

    function chooseResponse(opt) {
      playBeep(650);
      const convo = CONVERSATIONS[currentConvoIdx];
      const reply = (opt === 1) ? convo.r1 : convo.r2;
      document.getElementById("choices-box").style.display = "none";
      setFrogFace(opt === 1 ? 'wink' : 'think');
      typeWriterText(reply);
    }

    function triggerRandomDialogue() {
      triggerConvo(Math.floor(Math.random() * CONVERSATIONS.length));
    }

    // Autonomous conversation prompt every 60 seconds
    setInterval(() => {
      if (!STATE.isSleeping) {
        triggerRandomDialogue();
      }
    }, 60000);

    /* =========================================================================
       5. AUTONOMOUS ANIMATIONS & SPECIAL BEHAVIORS
       ========================================================================= */
    let animFrame = 0;
    const petChar = document.getElementById("pet-character");
    const soul = document.getElementById("belly-soul");

    function mainAnimationLoop() {
      animFrame++;
      if (!STATE.isSleeping) {
        const bounce = Math.sin(animFrame * 0.1) * 2;
        petChar.setAttribute("transform", `translate(85, ${52 + bounce})`);

        // Soul rhythmic pulse
        const scale = 1 + Math.sin(animFrame * 0.16) * 0.08;
        soul.setAttribute("transform", `scale(${scale}) translate(${15 - 15*scale}, ${30 - 30*scale})`);
      }
      requestAnimationFrame(mainAnimationLoop);
    }
    requestAnimationFrame(mainAnimationLoop);

    // Special micro-behaviors triggering every 5 minutes (or on poke)
    function runSpecialBehavior() {
      const fly = document.getElementById("fly-target");
      const tongue = document.getElementById("frog-tongue");
      const blep = document.getElementById("frog-blep");
      const lens = document.getElementById("prop-lens");

      const rand = Math.random();
      if (rand < 0.35) {
        // Fly snatch
        fly.style.display = "block";
        setTimeout(() => {
          tongue.style.display = "block";
          playBeep(700);
          setTimeout(() => {
            fly.style.display = "none";
            tongue.style.display = "none";
            typeWriterText("* SLURP! Fast micro-reaction test passed. My reflexes are optimal.");
          }, 240);
        }, 700);
      } else if (rand < 0.7) {
        // Magnifier Inspect
        lens.style.display = "block";
        setFrogFace('think');
        typeWriterText("* Running diagnostics on your study environment... Parameters acceptable.");
        setTimeout(() => { lens.style.display = "none"; setFrogFace('neutral'); }, 3000);
      } else {
        // Blep
        blep.style.display = "block";
        playBeep(500);
        setTimeout(() => { blep.style.display = "none"; }, 1600);
      }
    }
    setInterval(runSpecialBehavior, 300000); // 5 minutes

    function pokeFrog() {
      playBeep(580);
      runSpecialBehavior();
    }

    /* =========================================================================
       6. STATE, NAVIGATION & UI REFRESH
       ========================================================================= */
    let STATE = {
      dimIdx: 0,
      checked: {},
      skills: ["Foundational Empathy Anchor"],
      questStage: 2,
      isSleeping: false
    };

    function saveState() {
      try { localStorage.setItem("frog_undertale_save", JSON.stringify(STATE)); } catch(e) {}
    }
    try {
      const s = localStorage.getItem("frog_undertale_save");
      if (s) STATE = JSON.parse(s);
    } catch(e) {}

    function navTopic(delta) {
      playBeep(480);
      STATE.dimIdx = Math.max(0, Math.min(CORPUS.length - 1, STATE.dimIdx + delta));
      STATE.isSleeping = false;
      saveState();
      refreshUI();
      typeWriterText(`* Loaded Dimension ${STATE.dimIdx + 1}. Check the flowchart framework before drawing your note.`);
    }

    function refreshUI() {
      const cur = CORPUS[STATE.dimIdx];
      document.getElementById("nav-topic-title").innerText = cur.title;

      if (!STATE.checked[cur.id]) STATE.checked[cur.id] = [false, false, false, false, false];
      const checks = STATE.checked[cur.id];
      const done = checks.filter(Boolean).length;

      document.getElementById("exp-count").innerText = done;

      const list = document.getElementById("subcat-list");
      list.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `check-item ${checks[idx] ? 'done' : ''}`;
        item.innerText = p.name;
        list.appendChild(item);
      });

      document.getElementById("quest-desk").style.display = STATE.questStage >= 1 ? "block" : "none";
      document.getElementById("quest-lamp").style.display = STATE.questStage >= 2 ? "block" : "none";

      if (STATE.isSleeping) {
        petChar.style.display = "none";
        document.getElementById("pet-bed").style.display = "block";
      } else {
        petChar.style.display = "block";
        document.getElementById("pet-bed").style.display = "none";
      }
    }

    /* =========================================================================
       7. MODALS & FLOWCHART FRAMEWORK
       ========================================================================= */
    function openDiagramFramework() {
      const cur = CORPUS[STATE.dimIdx];
      document.getElementById("diagram-tree-text").innerText = cur.diagram;
      document.getElementById("diagram-modal").style.display = "flex";
    }

    function openStatsModal() {
      const content = document.getElementById("stats-content");
      content.innerHTML = `
        <div>* LV 1 (Psychological Observer)</div>
        <div>* AFFECTION: 100/100</div>
        <div>* DIMENSION: ${STATE.dimIdx + 1} / 30</div>
        <div style="margin-top:6px; color:var(--ut-yellow);">* UNLOCKED POWERS:</div>
        ${STATE.skills.map(s => `<div>  - ${s}</div>`).join('')}
      `;
      document.getElementById("stats-modal").style.display = "flex";
    }

    function closeModal(id) {
      playBeep(350);
      document.getElementById(id).style.display = "none";
    }

    /* =========================================================================
       8. PRECISION CAMERA SCANNER (OCR ENGINE)
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      playBeep(520);
      typeWriterText("* Processing paper image with neural OCR parser...");

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => runOCR(file);
        document.body.appendChild(s);
      } else {
        runOCR(file);
      }
    });

    async function runOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const text = res.data.text.toLowerCase();
        await worker.terminate();

        const cur = CORPUS[STATE.dimIdx];
        const checks = STATE.checked[cur.id];
        let newlyFound = 0;

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            const hasKeyword = part.kw.some(k => text.includes(k.toLowerCase()));
            const hasSyntax = text.includes("->") || text.includes("-->") || text.includes("—>") || text.includes("to");

            if (hasKeyword || hasSyntax) {
              checks[idx] = true;
              newlyFound++;
            }
          }
        });

        const total = checks.filter(Boolean).length;
        if (total === 5) {
          STATE.isSleeping = true;
          if (!STATE.skills.includes(cur.skill)) STATE.skills.push(cur.skill);
          setFrogFace('wink');
          typeWriterText(`* VICTORY! All 5 flowchart nodes verified. Superpower unlocked: [${cur.skill}]. Going to bed! 🛌`);
        } else if (newlyFound > 0) {
          setFrogFace('think');
          typeWriterText(`* Recognized ${newlyFound} valid flowchart nodes! Total: ${total}/5 verified.`);
        } else {
          setFrogFace('shock');
          typeWriterText("* Scanned paper, but could not detect matching diagram nodes or keywords. Ensure clear handwriting!");
        }

        saveState();
        refreshUI();
      } catch (err) {
        typeWriterText("* Scan error: Please ensure good lighting and hold the camera steady.");
      }
    }

    // Launch!
    refreshUI();
    triggerConvo(0);
  </script>
</body>
</html>
