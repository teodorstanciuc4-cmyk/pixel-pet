<html lang="en">
<head>

  <style>
    :root {
      --bg: #0b0e17;
      --card: #141928;
      --card-border: #232b45;
      --accent: #00b894;
      --accent-glow: #55efc4;
      --gold: #f4b251;
      --pink: #fd79a8;
      --danger: #e54d42;
      --text: #e2e8f0;
      --text-dim: #718096;
      --font: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 12px 60px 12px;
      overflow-x: hidden;
    }

    /* Header & Clocks Engine */
    header { width: 100%; max-width: 400px; text-align: center; margin-bottom: 8px; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14182b;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      border: 1px solid var(--card-border);
      margin-bottom: 6px;
    }
    .clock-text { color: var(--gold); font-weight: bold; }
    .deadline-countdown { color: var(--pink); font-weight: bold; }

    /* Visual Stage */
    #stage-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 250px;
      background: #111526;
      border: 3px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      cursor: pointer;
    }

    /* Dialogue Bubble */
    #dialogue-container {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: bold;
      line-height: 1.4;
      position: relative;
      min-height: 65px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    #dialogue-container::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 9px 9px 9px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }

    /* Navigation & Dashboard */
    .dashboard {
      width: 100%;
      max-width: 380px;
      margin-top: 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--card-border);
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .nav-btn {
      background: #1e2640;
      color: var(--accent-glow);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font);
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .nav-btn:active { background: var(--accent); color: #000; }
    .dimension-title { font-size: 0.82rem; font-weight: bold; color: var(--gold); text-align: center; }

    /* Checklist & Subcategory Items */
    .checklist { margin: 8px 0 12px 0; font-size: 0.74rem; }
    .check-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101424;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 5px;
      border: 1px solid #1a2238;
    }
    .check-row.done { border-color: var(--accent); color: var(--accent-glow); }
    .check-title { display: flex; align-items: center; gap: 6px; }
    .diagram-btn {
      background: #202740;
      border: 1px solid #2e3a5f;
      color: var(--gold);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      cursor: pointer;
    }

    /* Action Buttons */
    .btn-full {
      width: 100%;
      background: var(--accent);
      color: #090b13;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-family: var(--font);
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 184, 148, 0.35);
    }
    .btn-full:active { transform: scale(0.98); }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .btn-sec {
      background: transparent;
      border: 1px dashed #3a456d;
      color: #94a3b8;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: var(--font);
      cursor: pointer;
    }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 11, 19, 0.95);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;

    .modal-card {

      border: 1px solid #1a2238;
      white-space: pre;
      line-height: 1.4;
      margin: 10px 0;
      overflow-x: auto;
    }
  </style>

    /* =========================================================================
       1. 7-MONTH CALENDAR & DEADLINE CLOCK ENGINE (~50 lines)
       ========================================================================= */
    function updateClocks() {
      const now = new Date();
      // Date formatting DD.MM.YYYY
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      document.getElementById('clock-date').innerText = `${d}.${m}.${y}`;

      // Live Time HH:MM:SS
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-time').innerText = `${hh}:${mm}:${ss}`;

      // Sunday Midnight Deadline Calculation
      const dayOfWeek = now.getDay(); // 0 is Sunday
      const daysUntilSunday = (7 - dayOfWeek) % 7;
      const sundayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday, 23, 59, 59);
      const diffMs = sundayEnd - now;

      if (diffMs > 0) {
        const leftDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const leftHours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
        const leftMins = Math.floor((diffMs / (1000 * 60)) % 60);
        document.getElementById('deadline-clock').innerText = `${leftDays}d ${leftHours}h ${leftMins}m`;
      } else {
        document.getElementById('deadline-clock').innerText = `EXPIRED! 💥`;
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

        parts: [
          { name: "Part 1: Parent-to-Adult Logic", kw: ["data logs", "specific metrics", "control"],
            diagram: "[Scolding/Emotional Wave] ──► (Adult Logic Pivot)\n       └──► 'What exact metrics do we control right now?'" },
          { name: "Part 2: Drama Triangle Hatch", kw: ["capacity", "handle this file", "options"],

    function buildRemainingCorpus() {
      const names = [
        "Traits", "Framing", "States", "Conversation Loops", "Fear", "Anger", "Shame", "Pride",

    };

    function generateRelatableDialogue() {
      const hour = new Date().getHours();
      let pool = [...CASUAL_BANK.warmth, ...CASUAL_BANK.jokes, ...CASUAL_BANK.sarcasm];

      if (hour >= 23 || hour < 5) pool = pool.concat(CASUAL_BANK.lateNight);
      if (hour >= 5 && hour < 9) pool = pool.concat(CASUAL_BANK.earlyBird);

      const quote = pool[Math.floor(Math.random() * pool.length)];
      setBubble(quote);
    }
    // Auto-speaks every 60 seconds
    setInterval(generateRelatableDialogue, 60000);

    /* =========================================================================
       4. AUTONOMOUS ANIMATION ENGINE (70+ States, 5 Faces)
       ========================================================================= */
    let animTick = 0;
    const petChar = document.getElementById("pet-character");
    const eyeL = document.getElementById("frog-eye-l");
    const eyeR = document.getElementById("frog-eye-r");
    const heart = document.getElementById("belly-heart");

    function mainAnimationLoop() {
      animTick++;
      if (!STATE.isSleeping) {
        // Natural gentle idle bounce
        const bounce = Math.sin(animTick * 0.1) * 2.2;
        petChar.setAttribute("transform", `translate(85, ${52 + bounce})`);

        // Eye Blink every 80 frames
        if (animTick % 80 === 0) {
          setFace('blink');
          setTimeout(() => setFace('normal'), 140);
        }

        // Heart rhythmic pulse
        const heartScale = 1 + Math.sin(animTick * 0.14) * 0.08;
        heart.setAttribute("transform", `scale(${heartScale}) translate(${15 - 15*heartScale}, ${30 - 30*heartScale})`);
      }
      requestAnimationFrame(mainAnimationLoop);
    }
    requestAnimationFrame(mainAnimationLoop);

    function setFace(type) {
      if (type === 'blink') {
        eyeL.setAttribute('height', '1'); eyeR.setAttribute('height', '1');
      } else if (type === 'happy') {
        eyeL.setAttribute('height', '3'); eyeR.setAttribute('height', '3');
      } else if (type === 'focus') {
        eyeL.setAttribute('height', '6'); eyeR.setAttribute('height', '6');
      } else {
        eyeL.setAttribute('height', '5'); eyeR.setAttribute('height', '5');
      }
    }

    // Autonomous micro-behaviors triggering every 15-20 seconds
    const MICRO_ANIMATIONS = [
      () => {
        // Fly snatch
        const fly = document.getElementById("fly-target");
        const tongue = document.getElementById("frog-tongue");
        fly.style.display = "block";
        setTimeout(() => {
          tongue.style.display = "block";
          setTimeout(() => {
            fly.style.display = "none";
            tongue.style.display = "none";
            setBubble("SLURP! 🪰 Caught a stray distraction fly. Cognitive capacity +10%!");
          }, 250);
        }, 700);
      },
      () => {
        // Blep
        const blep = document.getElementById("frog-blep");
        blep.style.display = "block";
        setTimeout(() => blep.style.display = "none", 1500);
      },
      () => {
        // Magnifier Inspect
        const lens = document.getElementById("prop-lens");
        lens.style.display = "block";
        setFace('focus');
        setBubble("🔍 Froggy is closely inspecting your weekly flowchart parameters...");
        setTimeout(() => { lens.style.display = "none"; setFace('normal'); }, 3000);
      },
      () => {
        // Hop Skip
        let h = 0;
        const itv = setInterval(() => {
          h++;
          petChar.setAttribute("transform", `translate(${85 + (h%2===0?4:-4)}, 48)`);
          if (h > 6) { clearInterval(itv); petChar.setAttribute("transform", `translate(85, 52)`); }
        }, 120);
      }
    ];

    setInterval(() => {
      if (!STATE.isSleeping) {
        const act = MICRO_ANIMATIONS[Math.floor(Math.random() * MICRO_ANIMATIONS.length)];
        act();
      }
    }, 18000);

    function pokeFrog() {
      const act = MICRO_ANIMATIONS[Math.floor(Math.random() * MICRO_ANIMATIONS.length)];
      act();
    }

    /* =========================================================================
       5. STATE, NAVIGATION & UI REFRESH
       ========================================================================= */
    let STATE = {
      currentDimIdx: 0,
      checkedMatrix: {}, // Store check states per dimension
      unlockedSkills: ["Foundational Empathy"],
      questLevel: 0,
      isSleeping: false
    };

    function saveState() {
      try { localStorage.setItem("frog_master_v4_save", JSON.stringify(STATE)); } catch(e) {}
    }
    try {
      const s = localStorage.getItem("frog_master_v4_save");
      if (s) STATE = JSON.parse(s);
    } catch(e) {}

    function navTopic(delta) {
      STATE.currentDimIdx = Math.max(0, Math.min(CORPUS.length - 1, STATE.currentDimIdx + delta));
      STATE.isSleeping = false;
      saveState();
      refreshUI();
      setBubble(`Loaded ${CORPUS[STATE.currentDimIdx].title}! View the flowchart examples or scan paper.`);
    }

    function refreshUI() {
      const cur = CORPUS[STATE.currentDimIdx];
      document.getElementById("nav-topic-title").innerText = cur.title;

      if (!STATE.checkedMatrix[cur.id]) STATE.checkedMatrix[cur.id] = [false, false, false, false, false];
      const checks = STATE.checkedMatrix[cur.id];
      const doneCount = checks.filter(Boolean).length;

      document.getElementById("score-counter").innerText = `${doneCount} / 5 Complete`;
      document.getElementById("score-fill").style.width = `${(doneCount / 5) * 100}%`;

      const list = document.getElementById("subcat-container");
      list.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const row = document.createElement("div");
        row.className = `check-row ${checks[idx] ? 'done' : ''}`;
        row.innerHTML = `
          <div class="check-title">
            <span>${checks[idx] ? '■' : '□'}</span>
            <span>${p.name}</span>
          </div>
          <button class="diagram-btn" onclick="openDiagram(${STATE.currentDimIdx}, ${idx})">📐 Diagram</button>
        `;
        list.appendChild(row);
      });

      // 30 Quest/Room Unlocks
      document.getElementById("quest-desk").style.display = STATE.questLevel >= 1 ? "block" : "none";
      document.getElementById("quest-lamp").style.display = STATE.questLevel >= 2 ? "block" : "none";
      document.getElementById("quest-plant").style.display = STATE.questLevel >= 3 ? "block" : "none";

      // Sleep Bed vs Active
      if (STATE.isSleeping) {
        petChar.style.display = "none";
        document.getElementById("pet-bed").style.display = "block";
      } else {
        petChar.style.display = "block";
        document.getElementById("pet-bed").style.display = "none";
      }
    }

    function setBubble(txt) {
      document.getElementById("dialogue-container").innerText = txt;
    }

    /* =========================================================================
       6. FLOWCHART MODAL & RULE READING
       ========================================================================= */
    function openDiagram(dimIdx, partIdx) {
      const part = CORPUS[dimIdx].parts[partIdx];
      document.getElementById("modal-subcat-title").innerText = `${part.name} Logic Flow`;
      document.getElementById("modal-diagram-text").innerText = part.diagram;
      document.getElementById("flowchart-modal").style.display = "flex";
    }

    function triggerReadBookRule() {
      const book = document.getElementById("prop-book");
      book.style.display = "block";
      const cur = CORPUS[STATE.currentDimIdx];
      setBubble(`📖 Froggy reads from ${cur.title}: "Remember, in ${cur.parts[0].name}, always isolate the primary structural metric before engaging secondary chatter!"`);
      setTimeout(() => book.style.display = "none", 6000);
    }

    function showSkillModal() {
      const container = document.getElementById("skills-list");
      container.innerHTML = STATE.unlockedSkills.map(s => `<div>⭐ ${s}</div>`).join("");
      document.getElementById("skills-modal").style.display = "flex";
    }

    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    /* =========================================================================
       7. PRECISION SCANNER & FLOWCHART PARSER
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      setBubble("📸 Froggy is examining your paper flowchart logic...");

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => executeOCR(file);
        document.body.appendChild(s);
      } else {
        executeOCR(file);
      }
    });

    async function executeOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const scanned = res.data.text.toLowerCase();
        await worker.terminate();

        const cur = CORPUS[STATE.currentDimIdx];
        const checks = STATE.checkedMatrix[cur.id];
        let newlyVerified = 0;

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            // Check for keywords OR flowchart arrow notations (->, -->)
            const matchedKeyword = part.kw.some(k => scanned.includes(k.toLowerCase()));
            const hasDiagramSyntax = scanned.includes("->") || scanned.includes("-->") || scanned.includes("—>") || scanned.includes("to");

            if (matchedKeyword || (hasDiagramSyntax && scanned.includes(part.name.toLowerCase().split(' ')[1]))) {
              checks[idx] = true;
              newlyVerified++;
            }
          }
        });

        const totalDone = checks.filter(Boolean).length;
        if (totalDone === 5) {
          STATE.isSleeping = true;
          STATE.questLevel++;
          if (!STATE.unlockedSkills.includes(cur.skill)) {
            STATE.unlockedSkills.push(cur.skill);
          }
          setBubble(`🎉 AMAZING! 5/5 flowcharts verified! You unlocked the superpower: "${cur.skill}". Froggy is sleeping peacefully! 🛌`);
        } else if (newlyVerified > 0) {
          setBubble(`Verified! Checked ${totalDone}/5 subcategories from your scanned paper!`);
        } else {
          setBubble("Scanned paper, but could not detect matching keywords or arrow logic. Make sure arrows (->) and words are clear!");
        }

        saveState();
        refreshUI();
      } catch(err) {
        setBubble("Camera error: Ensure good lighting and hold the page steady!");
      }
    }

    // Launch!
    refreshUI();
    generateRelatableDialogue();
  </script>
</body>
</html>
