<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelPet">

  <!-- OCR Scanner Engine -->

  <style>
    :root {
      --bg: #090b13;
      --panel: #131728;
      --accent: #5d68d1;
      --gold: #f4b251;
      --danger: #e54d42;
      --success: #39b54a;
      --text: #e2e8f0;
      --font-code: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-code);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px 60px 12px;
    }

    header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.05rem; color: var(--gold); letter-spacing: 1px; }
    .meta-tag { font-size: 0.68rem; color: #718096; margin-top: 2px; }

    /* Canvas Stage */
    #stage-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 240px;
      background: #101322;
      border: 3px solid #232a45;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; }

    /* Character Dialogue Bubble */
    #dialogue-container {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: bold;
      line-height: 1.4;
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #dialogue-container::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 9px 9px 9px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }

    /* Dashboard */
    .dashboard {
      width: 100%;
      max-width: 380px;
      margin-top: 14px;
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #232a45;
    }
    .metric-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 8px; background: #202740; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

    /* Checklist */
    .checklist { margin: 8px 0 12px 0; font-size: 0.72rem; }
    .check-item { display: flex; align-items: center; margin: 4px 0; color: #a0aec0; }
    .check-item.done { color: var(--success); font-weight: bold; }
    .check-item::before { content: '□ '; margin-right: 6px; }
    .check-item.done::before { content: '■ '; }

    /* Buttons */
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-family: var(--font-code);
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(93, 104, 209, 0.35);
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      border: 1px dashed #3a456d;
      color: #94a3b8;
      margin-top: 8px;
      padding: 9px;
      font-size: 0.72rem;
    }

    /* Pre-Launch Screen */
    #gate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #090a10;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #gate-screen h2 { color: var(--gold); margin-bottom: 8px; }
    #gate-screen p { color: #718096; font-size: 0.82rem; max-width: 310px; line-height: 1.5; }

    #scanner-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 19, 0.92);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.78rem;
      color: var(--gold);
      z-index: 10;
    }
  </style>
</head>

    <h2>STASIS LOCKOUT</h2>
    <p>Opening on <strong>08.11.2026</strong>.</p>

  </header>

  <!-- Canvas Stage -->
  <div id="stage-wrap">
    <canvas id="petCanvas" width="190" height="120"></canvas>
