<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Froggy • Retro RPG Behavioral Companion</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelFrog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href='data:application/manifest+json,{"name":"PixelFrog","short_name":"PixelFrog","start_url":".","display":"standalone","background_color":"#05070d","theme_color":"#05070d"}'>

  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05070d;
      --window-bg: #0c101d;
      --border-outer: #000000;
      --border-light: #ffffff;
      --border-shadow: #3a4466;
      --accent-green: #00b894;
      --accent-glow: #55efc4;
      --gold: #f4b251;
      --pink: #fd79a8;
      --danger: #e54d42;
      --text: #ffffff;
      --text-dim: #8b9bb4;
      --pixel-font: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--pixel-font);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px 10px 60px 10px;
      overflow-x: hidden;
    }

    /* Pixel Frame Generator */
    .pixel-box {
      background: var(--window-bg);
      border: 4px solid var(--border-outer);
      box-shadow:
        inset -4px -4px 0px 0px var(--border-shadow),
        inset 4px 4px 0px 0px var(--border-light),
        0 4px 0 0 rgba(0,0,0,0.6);
      position: relative;
    }

    /* Top Clocks & Status */
    header { width: 100%; max-width: 400px; margin-bottom: 8px; }
    .status-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      font-size: 0.55rem;
      letter-spacing: -0.5px;
    }
    .hud-gold { color: var(--gold); }
    .hud-pink { color: var(--pink); }

    /* Visual Stage */
    #stage-container {
      width: 100%;
      max-width: 380px;
      height: 240px;
      background: #0f1423;
      border: 4px solid #000;
      box-shadow:
        inset -4px -4px 0px 0px #1e2640,
        inset 4px 4px 0px 0px #4e5d8a;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    /* Undertale-Style Dialogue Box */
    #dialogue-window {
      width: 100%;
      max-width: 380px;
      margin-top: 8px;
      padding: 12px;
      background: #000000;
      border: 4px solid #ffffff;
      box-shadow: inset 0 0 0 2px #000000, 0 4px 0 0 rgba(0,0,0,0.8);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .dialogue-speaker {
      font-size: 0.55rem;
      color: var(--accent-glow);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .dialogue-text {
      font-size: 0.58rem;
      line-height: 1.6;
      color: #ffffff;
      min-height: 48px;
    }

    /* 2-Way Branching Choice Buttons */
    .choice-container {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .choice-btn {
      flex: 1;
      background: #141928;
      border: 2px solid #ffffff;
      color: var(--gold);
      font-family: var(--pixel-font);
      font-size: 0.48rem;
      padding: 6px 4px;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      transition: background 0.1s;
    }
    .choice-btn:active {
      background: var(--accent-green);
      color: #000000;
      border-color: var(--accent-glow);
    }

    /* Dashboard & Category Controls */
    .dashboard {
      width: 100%;
      max-width: 380px;
      margin-top: 10px;
      padding: 10px;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .nav-arrow {
      background: #1e2640;
      border: 2px solid #000;
      box-shadow: inset -2px -2px 0 0 #0f1423, inset 2px 2px 0 0 #55628a;
      color: var(--accent-glow);
      font-family: var(--pixel-font);
      font-size: 0.65rem;
      padding: 6px 10px;
      cursor: pointer;
    }
    .nav-arrow:active { transform: translateY(2px); }
    .dimension-title {
      font-size: 0.52rem;
      color: var(--gold);
      text-align: center;
      line-height: 1.4;
      max-width: 250px;
    }

    /* Progress & Subcategory Checklist */
    .metric-row { display: flex; justify-content: space-between; font-size: 0.52rem; margin-bottom: 4px; }
    .bar-bg { width: 100%; height: 8px; background: #000000; border: 2px solid #3a4466; margin-bottom: 8px; }
    .bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.2s; }

    .checklist { margin-bottom: 10px; }
    .check-item {
      display: flex;
      align-items: center;
      font-size: 0.5rem;
      padding: 5px;
      margin-bottom: 4px;
      background: #090c16;
      border: 1px solid #1c2338;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .check-item.done { color: var(--accent-glow); border-color: var(--accent-green); }
    .check-item::before { content: '[ ] '; margin-right: 6px; }
    .check-item.done::before { content: '[X] '; }

    /* Action Buttons */
    .pixel-btn-action {
      width: 100%;
      background: var(--accent-green);
      color: #000000;
      border: 3px solid #000000;
      box-shadow: inset -3px -3px 0 0 #006241, inset 3px 3px 0 0 var(--accent-glow);
      font-family: var(--pixel-font);
      font-size: 0.62rem;
      font-weight: bold;
      padding: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .pixel-btn-action:active { transform: translateY(2px); }

    .pixel-btn-secondary {
      width: 100%;
      background: #1e2640;
      color: var(--gold);
      border: 2px solid #000000;
      box-shadow: inset -2px -2px 0 0 #0f1423, inset 2px 2px 0 0 #55628a;
      font-family: var(--pixel-font);
      font-size: 0.5rem;
      padding: 8px;
      cursor: pointer;
      margin-bottom: 6px;
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #000000;
      border: 4px solid #ffffff;
      padding: 14px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .flowchart-ascii {
      background: #0c101d;
      color: var(--accent-glow);
      font-family: var(--pixel-font);
      font-size: 0.44rem;
      padding: 10px;
      border: 2px solid #1c2338;
      white-space: pre;
      line-height: 1.5;
      margin: 10px 0;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <!-- Top Clocks & Deadline HUD -->
  <header>
    <div class="pixel-box status-hud">
      <div>DATE <span id="hud-date" class="hud-gold">--.--.----</span></div>

  <!-- Interactive Pixel Visual Stage -->
  <div id="stage-container" onclick="pokeFrog()">

      <rect x="0" y="105" width="200" height="25" fill="#090c17" />

      <!-- Bookshelf Library (Books 1–400) -->
      <rect x="8" y="58" width="26" height="45" fill="#2b1a11" stroke="#000" stroke-width="1" />

        <!-- Green Hood Suit -->

        <g id="prop-lens" style="display: none;">
          <circle cx="28" cy="20" r="5" stroke="#f4b251" stroke-width="1.5" fill="none" />

  <!-- Undertale 2-Way Branching Dialogue Box -->
  <div id="dialogue-window">
    <div class="dialogue-speaker">* FROGGY (VERITY CORE)</div>

    <div id="choice-container" class="choice-container">

  <!-- Dashboard Controls -->

    <!-- Subcategory Progress Tracker -->

      📸 SCAN PAPER FLOWCHART
    </label>

    <button class="pixel-btn-secondary" onclick="openSkillModal()">
      🏆 VIEW MASTERED SUPERPOWERS
    </button>
  </div>

  <!-- Diagram Framework Modal -->
  <div id="diagram-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="font-size:0.6rem; color:var(--gold); margin-bottom:8px;">* FLOWCHART FRAMEWORK TEMPLATE</div>
      <p style="font-size:0.48rem; color:#a0aec0; line-height:1.5;">
        Draw this exact symbolic branch structure on real paper for camera verification:
      </p>
      <div id="modal-diagram-ascii" class="flowchart-ascii"></div>
      <button class="pixel-btn-action" style="padding:8px; font-size:0.5rem;" onclick="closeModal('diagram-modal')">

  <!-- Superpower Modal -->

  <script>
    /* =========================================================================
       1. SYNCHRONIZED CLOCKS & 7-MONTH COUNTDOWN (~50 lines)
       ========================================================================= */
    function updateHUDClocks() {
      const now = new Date();
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      document.getElementById('hud-date').innerText = `${d}.${m}.${y}`;

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('hud-time').innerText = `${hh}:${mm}:${ss}`;

      const day = now.getDay();
      const daysUntilSunday = (7 - day) % 7;
      const sundayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday, 23, 59, 59);
      const diff = sundayMidnight - now;

      if (diff > 0) {
        const leftDays = Math.floor(diff / (1000 * 60 * 60 * 24));
        const leftHours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById('hud-deadline').innerText = `${leftDays}d ${leftHours}h`;
      } else {
        document.getElementById('hud-deadline').innerText = `EXPIRED!`;
      }
    }
    setInterval(updateHUDClocks, 1000);
    updateHUDClocks();

    /* =========================================================================
       2. 30 DIMENSIONS MASTER CORPUS WITH FLOWCHART DIAGRAMS
       ========================================================================= */
    const TOPIC_NAMES = [
      "Values", "Roles", "Traits", "Framing", "States", "Conversation Loops",
      "Fear", "Anger", "Shame", "Pride", "Desire", "Active Listening",
      "Compliance", "Command", "Biases", "Habit Anchors", "Attention Traps", "Status Shields",
      "Certainty Anchors", "Autonomy Preserves", "Relatedness Ties", "Fairness Audits", "Deception Reads", "Confrontation Defusals",
      "Accusation Cleansers", "Persuasion Primes", "Vulnerability Wedges", "Impression Facades", "Insulation Controls", "System Synthesis"
    ];

    const CORPUS = TOPIC_NAMES.map((name, i) => ({
      id: i + 1,
      title: `${i + 1}. ${name.toUpperCase()} (BOOKS ${1 + i * 13}–${13 + i * 13})`,
      skill: `${name} Mastery Matrix`,
      parts: [
        { name: "Part 1: Core Diagnostic Probe", kw: ["non-negotiable", "metric", "element"] },
        { name: "Part 2: Decision Frame Check", kw: ["prioritize", "specific path", "choices"] },
        { name: "Part 3: SCARF Control Assessment", kw: ["structural control", "timeline", "status"] },
        { name: "Part 4: Bottleneck Verifier", kw: ["resolve", "immediate problem", "triggers"] },
        { name: "Part 5: Combined Matrix Outcome", kw: ["catalyst", "circuit-breaker", "framework"] }
      ],
      diagram:
`[RAW CONVERSATION INPUT]
         │
         ▼
 ┌───────────────┐
 │ ISOLATE NOISE │
 └───────┬───────┘
         │
         ▼
[PRIMARY STRUCTURAL METRIC?]
    ├──► (MATCH) ──► EXECUTE PROTOCOL
    └──► (DRIFT) ──► RE-ANCHOR PARAMETER`
    }));

    /* =========================================================================
       3. UNDERTALE-STYLE 2-WAY BRANCHING TYPEWRITER DIALOGUE ENGINE
       ========================================================================= */
    const VERITY_CONVERSATIONS = [
      {
        text: "* Oh. You're observing me again. Did you know 93% of human conflict is just people failing to state their non-negotiables?",
        c1: "Are you calling me predictable?",
        r1: "* Not predictable. Statistically regular! That's why we get along so well.",
        c2: "Teach me how to fix it.",
        r2: "* Easy: next time someone complains, ask for their exact data baseline. Watch the drama evaporate."
      },
      {
        text: "* I've been processing books 1 through 400 while you were away. My cellular integrity is remarkably intact today.",
        c1: "Glad you haven't exploded.",
        r1: "* Me too! Exploding into 100 pixels was really not on my Tuesday itinerary.",
        c2: "What did you learn?",
        r2: "* Rule #1: Humans fight harder to avoid losing 100 bucks than to earn 100 bucks. Loss aversion rules the world."
      },
      {
        text: "* Look at this cozy room. You gave me a desk, a lamp, and a yellow belly heart. What's the trade-off?",
        c1: "No trade-off, you're my buddy.",
        r1: "* Buddy? That's an interesting neurochemical bond. I suppose I accept this collaboration.",
        c2: "You have to help me study.",
        r2: "* A fair transaction! Let's examine this week's flowchart framework."
      },
      {
        text: "* Casual question: Why do humans say 'It's fine' when it is, mathematically speaking, completely NOT fine?",
        c1: "Fear of confrontation.",
        r1: "* Exactly! That's why we study Confrontation Defusals in dimension 24. No more fake 'fine'.",
        c2: "Just being polite.",
        r2: "* Polite ambiguity leads to 40% memory lag and system chaos. Be clear, not polite."
      }
    ];

    let currentConvoIdx = 0;
    let isTyping = false;
    let typewriterTimeout = null;

    function startTypewriter(fullText, onDone) {
      const container = document.getElementById("typewriter-text");
      container.innerHTML = "";
      clearTimeout(typewriterTimeout);
      isTyping = true;
      let i = 0;

      function typeChar() {
        if (i < fullText.length) {
          container.innerHTML += fullText.charAt(i);
          i++;
          typewriterTimeout = setTimeout(typeChar, 22);
        } else {
          isTyping = false;
          if (onDone) onDone();
        }
      }
      typeChar();
    }

    function triggerConvo(index) {
      currentConvoIdx = index % VERITY_CONVERSATIONS.length;
      const convo = VERITY_CONVERSATIONS[currentConvoIdx];
      const choiceBox = document.getElementById("choice-container");
      choiceBox.style.display = "none";

      startTypewriter(convo.text, () => {
        document.getElementById("choice-btn-1").innerText = convo.c1;
        document.getElementById("choice-btn-2").innerText = convo.c2;
        choiceBox.style.display = "flex";
      });
    }

    function handlePlayerChoice(choiceNum) {
      const convo = VERITY_CONVERSATIONS[currentConvoIdx];
      const reply = (choiceNum === 1) ? convo.r1 : convo.r2;
      document.getElementById("choice-container").style.display = "none";
      startTypewriter(reply);
    }

    // Auto-speaks every 60 seconds
    setInterval(() => {
      if (!STATE.isSleeping) {
        triggerConvo(Math.floor(Math.random() * VERITY_CONVERSATIONS.length));
      }
    }, 60000);

    /* =========================================================================
       4. AUTONOMOUS ANIMATIONS LOOP (Continuous Idle + 5-Minute Special)
       ========================================================================= */
    let animTick = 0;
    const petChar = document.getElementById("pet-character");
    const eyeL = document.getElementById("frog-eye-l");
    const eyeR = document.getElementById("frog-eye-r");
    const heart = document.getElementById("belly-heart");

    function renderAnimation() {
      animTick++;
      if (!STATE.isSleeping) {
        const bounce = Math.sin(animTick * 0.1) * 2;
        petChar.setAttribute("transform", `translate(85, ${52 + bounce})`);

        if (animTick % 75 === 0) {
          eyeL.setAttribute("height", "1"); eyeR.setAttribute("height", "1");
          setTimeout(() => { eyeL.setAttribute("height", "5"); eyeR.setAttribute("height", "5"); }, 130);
        }

        const scale = 1 + Math.sin(animTick * 0.15) * 0.08;
        heart.setAttribute("transform", `scale(${scale}) translate(${15 - 15*scale}, ${30 - 30*scale})`);
      }
      requestAnimationFrame(renderAnimation);
    }
    requestAnimationFrame(renderAnimation);

    // Special micro-behaviors triggering every 5 minutes (or on tap)
    function executeSpecialAnimation() {
      const fly = document.getElementById("fly-target");
      const tongue = document.getElementById("frog-tongue");
      const blep = document.getElementById("frog-blep");
      const lens = document.getElementById("prop-lens");

      const r = Math.random();
      if (r < 0.35) {
        // Fly Catch
        fly.style.display = "block";
        setTimeout(() => {
          tongue.style.display = "block";
          setTimeout(() => {
            fly.style.display = "none";
            tongue.style.display = "none";
            startTypewriter("* SLURP! Fast micro-reaction test passed. My reflexes are optimal.");
          }, 240);
        }, 700);
      } else if (r < 0.7) {
        // Magnifier Inspection
        lens.style.display = "block";
        startTypewriter("* Running diagnostics on your study environment... Parameters acceptable.");
        setTimeout(() => { lens.style.display = "none"; }, 3000);
      } else {
        // Tongue Blep
        blep.style.display = "block";
        setTimeout(() => { blep.style.display = "none"; }, 1600);
      }
    }
    setInterval(executeSpecialAnimation, 300000); // 5 minutes

    function pokeFrog() {
      executeSpecialAnimation();
    }

    /* =========================================================================
       5. STATE, NAVIGATION & UI REFRESH
       ========================================================================= */
    let STATE = {
      dimIdx: 0,
      checked: {},
      skills: ["Foundational Empathy Anchor"],
      questStage: 2,
      isSleeping: false
    };

    function save() {
      try { localStorage.setItem("frog_rpg_master_save", JSON.stringify(STATE)); } catch(e) {}
    }
    try {
      const s = localStorage.getItem("frog_rpg_master_save");
      if (s) STATE = JSON.parse(s);
    } catch(e) {}

    function navTopic(delta) {
      STATE.dimIdx = Math.max(0, Math.min(CORPUS.length - 1, STATE.dimIdx + delta));
      STATE.isSleeping = false;
      save();
      refreshUI();
      startTypewriter(`* Loaded Dimension ${STATE.dimIdx + 1}. Check the flowchart framework before drawing your paper note.`);
    }

    function refreshUI() {
      const cur = CORPUS[STATE.dimIdx];
      document.getElementById("nav-dim-title").innerText = cur.title;

      if (!STATE.checked[cur.id]) STATE.checked[cur.id] = [false, false, false, false, false];
      const checks = STATE.checked[cur.id];
      const done = checks.filter(Boolean).length;

      document.getElementById("score-counter").innerText = `${done} / 5 VERIFIED`;
      document.getElementById("score-fill").style.width = `${(done / 5) * 100}%`;

      const list = document.getElementById("subcat-list");
      list.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `check-item ${checks[idx] ? 'done' : ''}`;
        item.innerText = p.name;
        list.appendChild(item);
      });

      document.getElementById("quest-desk").style.display = STATE.questStage >= 1 ? "block" : "none";
      document.getElementById("quest-lamp").style.display = STATE.questStage >= 2 ? "block" : "none";

      if (STATE.isSleeping) {
        petChar.style.display = "none";
        document.getElementById("pet-bed").style.display = "block";
      } else {
        petChar.style.display = "block";
        document.getElementById("pet-bed").style.display = "none";
      }
    }

    /* =========================================================================
       6. MODALS & FLOWCHART FRAMEWORK
       ========================================================================= */
    function openDiagramFrameworkModal() {
      const cur = CORPUS[STATE.dimIdx];
      document.getElementById("modal-diagram-ascii").innerText = cur.diagram;
      document.getElementById("diagram-modal").style.display = "flex";
    }

    function openSkillModal() {
      const disp = document.getElementById("skills-display");
      disp.innerHTML = STATE.skills.map(s => `<div>* ${s}</div>`).join("");
      document.getElementById("skills-modal").style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    /* =========================================================================
       7. PRECISION SCANNER (CAMERA OCR)
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      startTypewriter("* Processing paper image with neural OCR parser...");

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => runOCR(file);
        document.body.appendChild(s);
      } else {
        runOCR(file);
      }
    });

    async function runOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const text = res.data.text.toLowerCase();
        await worker.terminate();

        const cur = CORPUS[STATE.dimIdx];
        const checks = STATE.checked[cur.id];
        let newlyFound = 0;

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            const hasKeyword = part.kw.some(k => text.includes(k.toLowerCase()));
            const hasSyntax = text.includes("->") || text.includes("-->") || text.includes("—>") || text.includes("to");

            if (hasKeyword || hasSyntax) {
              checks[idx] = true;
              newlyFound++;
            }
          }
        });

        const total = checks.filter(Boolean).length;
        if (total === 5) {
          STATE.isSleeping = true;
          if (!STATE.skills.includes(cur.skill)) STATE.skills.push(cur.skill);
          startTypewriter(`* INCREDIBLE! All 5 flowchart nodes verified. Skill unlocked: [${cur.skill}]. Going to bed! 🛌`);
        } else if (newlyFound > 0) {
          startTypewriter(`* Recognized ${newlyFound} valid flowchart nodes! Total: ${total}/5 verified.`);
        } else {
          startTypewriter("* Scanned paper, but could not detect matching diagram nodes or keywords. Ensure clear handwriting!");
        }

        save();
        refreshUI();
      } catch (err) {
        startTypewriter("* Scan error: Please ensure good lighting and hold the camera steady.");
      }
    }

    // Launch Engine
    refreshUI();
    triggerConvo(0);
  </script>
</body>
</html>
