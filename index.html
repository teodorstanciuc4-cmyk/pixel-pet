<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UNDERTALE • FROGGY BEHAVIORAL MATRIX</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelFrog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href='data:application/manifest+json,{"name":"PixelFrog","short_name":"PixelFrog","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>

  <!-- 8-Bit Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       1. AUTHENTIC UNDERTALE RETRO ENGINE STYLES
       ========================================================================= */
    :root {
      --ut-black: #000000;
      --ut-white: #ffffff;
      --ut-orange: #ff9900;
      --ut-yellow: #ffff00;
      --ut-red: #ff0000;
      --ut-green-grid: #00aa44;
      --ut-gray: #444444;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      background-color: var(--ut-black);
      color: var(--ut-white);
      font-family: var(--font-pixel);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 60px 6px;
      overflow-x: hidden;
    }

    /* Screen container wrapper */
    .screen-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Stasis Header */
    .stasis-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.46rem;
      border: 3px solid var(--ut-white);
      padding: 6px 8px;
      margin-bottom: 6px;
      background: #000;
      color: var(--ut-yellow);
    }

    /* Undertale Encounter Arena Canvas (Green Grid Box) */
    #arena-container {
      width: 100%;
      height: 210px;
      background: #000;
      border: 4px solid var(--ut-white);
      position: relative;
      overflow: hidden;
    }

    canvas#pixelCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    /* Dialogue & Encounter Text Box */
    #dialogue-box {
      width: 100%;
      margin-top: 6px;
      background: #000;
      border: 4px solid var(--ut-white);
      padding: 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .dialogue-text {
      font-size: 0.55rem;
      line-height: 1.6;
      color: var(--ut-white);
      min-height: 48px;
      word-break: break-word;
    }

    /* 2-Way Branch Choices inside Box */
    .dialogue-choices {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .choice-btn {
      flex: 1;
      background: #000;
      border: 2px solid var(--ut-white);
      color: var(--ut-yellow);
      font-family: var(--font-pixel);
      font-size: 0.44rem;
      padding: 6px 4px;
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
    }
    .choice-btn::before {
      content: "❤️ ";
      color: var(--ut-red);
    }
    .choice-btn:active {
      background: var(--ut-orange);
      color: #000;
    }

    /* Bottom Undertale Status HUD */
    .ut-status-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.58rem;
      padding: 0 4px;
    }

    .hp-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-bar-box {
      width: 32px;
      height: 14px;
      background: var(--ut-red);
      position: relative;
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--ut-yellow);
    }

    /* The 4 Iconic Undertale Action Buttons (FIGHT, ACT, ITEM, MERCY) */
    .action-button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .btn-undertale {
      background: #000;
      border: 3px solid var(--ut-orange);
      color: var(--ut-orange);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      padding: 10px 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-undertale:active, .btn-undertale.selected {
      background: var(--ut-orange);
      color: #000;
    }

    /* Subcategory Track Dashboard */
    .curriculum-tray {
      width: 100%;
      margin-top: 8px;
      border: 3px solid var(--ut-white);
      background: #000;
      padding: 8px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .nav-arrow {
      background: #000;
      border: 2px solid var(--ut-white);
      color: var(--ut-yellow);
      font-family: var(--font-pixel);
      font-size: 0.6rem;
      padding: 4px 10px;
      cursor: pointer;
    }
    .nav-arrow:disabled {
      color: var(--ut-gray);
      border-color: var(--ut-gray);
    }

    .track-title {
      font-size: 0.48rem;
      color: var(--ut-yellow);
      text-align: center;
      max-width: 250px;
      line-height: 1.4;
    }

    .subcat-list {
      margin-top: 6px;
    }

    .subcat-item {
      font-size: 0.44rem;
      padding: 5px;
      border: 1px solid #222;
      background: #050505;
      color: #888;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
    }
    .subcat-item.done {
      color: #00ff66;
      border-color: #00aa44;
    }
    .subcat-item::before { content: "[ ] "; margin-right: 6px; }
    .subcat-item.done::before { content: "[*] "; color: var(--ut-yellow); }

    /* Modals */
    .ut-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .ut-modal-box {
      width: 100%;
      max-width: 380px;
      background: #000;
      border: 4px solid var(--ut-white);
      padding: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .ascii-blueprint {
      background: #050505;
      color: #00ff66;
      font-family: var(--font-pixel);
      font-size: 0.4rem;
      padding: 8px;
      border: 2px solid #333;
      white-space: pre;
      line-height: 1.5;
      margin: 8px 0;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <!-- Top Countdown HUD -->
    <div class="stasis-header">
      <div>TARGET: 08.11.2026</div>
      <div>COUNTDOWN: <span id="stasis-timer" style="color:var(--ut-white);">--:--:--</span></div>
    </div>

    <!-- Undertale Green Grid Arena Canvas -->
    <div id="arena-container">
      <canvas id="pixelCanvas" width="200" height="130"></canvas>
    </div>

    <!-- Undertale Typewriter Dialogue Window -->
    <div id="dialogue-box">
      <div id="dialogue-text" class="dialogue-text">* ...</div>
      <div id="dialogue-choices" class="dialogue-choices" style="display: none;">
        <button id="choice-1" class="choice-btn" onclick="makeChoice(1)">Option A</button>
        <button id="choice-2" class="choice-btn" onclick="makeChoice(2)">Option B</button>
      </div>
    </div>

    <!-- Undertale Bottom Stats Bar -->
    <div class="ut-status-bar">
      <div>HUMAN LV <span id="hud-level">1</span></div>
      <div class="hp-container">
        <span>HP</span>
        <div class="hp-bar-box">
          <div class="hp-bar-fill"></div>
        </div>
        <span>20/20</span>
      </div>
      <div>EXP <span id="hud-exp" style="color:var(--ut-yellow);">0</span>/5</div>
    </div>

    <!-- 4 Action Buttons -->
    <div class="action-button-grid">
      <!-- FIGHT = Open Camera Scanner -->
      <label for="camera-input" class="btn-undertale" onclick="playAudioBlip(550)">
        <span>⚔️</span>
        <span>FIGHT</span>
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

      <!-- ACT = Talk / Check Rules -->
      <button class="btn-undertale" onclick="handleActMenu()">
        <span>🗣</span>
        <span>ACT</span>
      </button>

      <!-- ITEM = Unlocked Room Decor -->
      <button class="btn-undertale" onclick="handleItemMenu()">
        <span>🎒</span>
        <span>ITEM</span>
      </button>

      <!-- MERCY = Stasis Details / Surrender -->
      <button class="btn-undertale" onclick="handleMercyMenu()">
        <span>💔</span>
        <span>MERCY</span>
      </button>
    </div>

    <!-- 30 Progression-Locked Curriculum Tray -->
    <div class="curriculum-tray">
      <div class="nav-row">
        <button id="nav-left" class="nav-arrow" onclick="stepTrack(-1)">&lt;</button>
        <div id="track-name" class="track-title">TRACK 1: VALUES (BOOKS 1–13)</div>
        <button id="nav-right" class="nav-arrow" onclick="stepTrack(1)">&gt;</button>
      </div>

      <div class="subcat-list" id="subcat-mount"></div>
    </div>
  </div>

  <!-- MODAL: ACT / DIAGRAM BLUEPRINT -->
  <div id="blueprint-modal" class="ut-modal">
    <div class="ut-modal-box">
      <div style="font-size:0.5rem; color:var(--ut-yellow); margin-bottom:6px;">* FLOWCHART LOGIC BLUEPRINT</div>
      <p style="font-size:0.42rem; color:#aaa; line-height:1.4;">
        Every pixel node must be drawn clearly on real paper for FIGHT (Scan) recognition:
      </p>
      <div id="ascii-mount" class="ascii-blueprint"></div>
      <button class="btn-undertale" style="width:100%; padding:8px;" onclick="closeModal('blueprint-modal')">
        * [ RETURN ]
      </button>
    </div>
  </div>

  <!-- MODAL: STATS / POWERS -->
  <div id="powers-modal" class="ut-modal">
    <div class="ut-modal-box">
      <div style="font-size:0.5rem; color:var(--ut-yellow); margin-bottom:6px;">* UNLOCKED COMMUNICATION POWERS</div>
      <div id="powers-mount" style="font-size:0.42rem; color:#00ff66; line-height:1.8; margin:8px 0;"></div>
      <button class="btn-undertale" style="width:100%; padding:8px;" onclick="closeModal('powers-modal')">
        * [ BACK ]
      </button>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. WEB AUDIO 8-BIT UNDERTALE SOUND ENGINE
       ========================================================================= */
    let audioContext = null;
    function getAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playAudioBlip(freq = 150) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq + Math.random() * 20, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.035);
      } catch (e) {}
    }

    /* =========================================================================
       2. REAL-TIME TARGET COUNTDOWN (08.11.2026)
       ========================================================================= */
    function updateStasisCountdown() {
      const now = new Date();
      const target = new Date("2026-11-08T00:00:00");
      const diff = target - now;

      if (diff > 0) {
        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / (1000 * 60)) % 60);
        const s = Math.floor((diff / 1000) % 60);
        document.getElementById("stasis-timer").innerText = `${d}d ${h}h ${m}m ${s}s`;
      } else {
        document.getElementById("stasis-timer").innerText = `OFFICIALLY LAUNCHED!`;
      }
    }
    setInterval(updateStasisCountdown, 1000);
    updateStasisCountdown();

    /* =========================================================================
       3. STRICT PROGRESSION 30 TRACK CURRICULUM
       ========================================================================= */
    const TRACK_NAMES = [
      "Values", "Roles", "Traits", "Framing", "States", "Conversation Loops",
      "Fear", "Anger", "Shame", "Pride", "Desire", "Active Listening",
      "Compliance", "Command", "Biases", "Habit Anchors", "Attention Traps", "Status Shields",
      "Certainty Anchors", "Autonomy Preserves", "Relatedness Ties", "Fairness Audits", "Deception Reads", "Confrontation Defusals",
      "Accusation Cleansers", "Persuasion Primes", "Vulnerability Wedges", "Impression Facades", "Insulation Controls", "System Synthesis"
    ];

    const TRACKS = TRACK_NAMES.map((name, i) => ({
      id: i + 1,
      title: `TRACK ${i + 1}: ${name.toUpperCase()} (BOOKS ${1 + i * 13}–${13 + i * 13})`,
      powerBadge: `${name} Mastery Shield`,
      parts: [
        { name: "Part 1: Core Diagnostic Probe", kw: ["non-negotiable", "metric", "element"] },
        { name: "Part 2: Decision Frame Check", kw: ["prioritize", "specific path", "choices"] },
        { name: "Part 3: SCARF Control Assessment", kw: ["structural control", "timeline", "status"] },
        { name: "Part 4: Bottleneck Verifier", kw: ["resolve", "immediate problem", "triggers"] },
        { name: "Part 5: Combined Matrix Outcome", kw: ["catalyst", "circuit-breaker", "framework"] }
      ],
      blueprint:
`+-----------------------------+
|    RAW CONVERSATION INPUT   |
+--------------+--------------+
               |
               v
     /-------------------\\
    < ISOLATE NOISE WORD  >
     \\-------------------/
               |
               v
+--------------+--------------+
|   PRIMARY CRITERIA MATCH?   |
+--------------+--------------+
       |               |
     (YES)            (NO)
       |               |
       v               v
 [LOCK FRAMEWORK] [CIRCUIT BREAKER]`
    }));

    /* =========================================================================
       4. PURE PIXEL CANVAS RENDERING ENGINE & WANDERING AI
       ========================================================================= */
    const canvas = document.getElementById("pixelCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    // AI Walking State Machine
    let frog = {
      x: 90,
      y: 72,
      targetX: 90,
      vx: 0,
      facing: 1, // 1: right, -1: left
      state: "IDLE", // IDLE, WALK, SIT, SLEEP
      timer: 0,
      animFrame: 0
    };

    // Low-res chunky pixel palettes
    const P = {
      black: "#000000",
      outline: "#15181f",
      greenDark: "#025433",
      greenMain: "#00a86b",
      greenBright: "#00e699",
      pinkTrim: "#ff597b",
      skin: "#fcd5a0",
      bellyYellow: "#fce373",
      bellyPink: "#e83a82",
      white: "#ffffff",
      gridGreen: "#006622"
    };

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function renderScene() {
      // 1. Draw Undertale Green Grid Arena Background
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines (pure pixel stepping)
      ctx.strokeStyle = P.gridGreen;
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 2. Room Furniture (Bookshelf)
      drawPixelRect(8, 60, 24, 48, P.black);
      // Outer pixel outline
      ctx.strokeStyle = P.white;
      ctx.strokeRect(8, 60, 24, 48);
      // Colored book spines
      drawPixelRect(11, 65, 18, 5, "#ff4757");
      drawPixelRect(11, 74, 18, 5, "#00a86b");
      drawPixelRect(11, 83, 18, 5, "#fce373");
      drawPixelRect(11, 92, 18, 5, "#ff597b");

      // Desk & Lamp (if unlocked)
      if (STATE.highestTrack >= 1) {
        drawPixelRect(150, 84, 42, 24, P.black);
        ctx.strokeRect(150, 84, 42, 24);
        drawPixelRect(156, 76, 8, 8, P.white);
      }
      if (STATE.highestTrack >= 2) {
        drawPixelRect(178, 60, 2, 24, P.white);
        drawPixelRect(173, 54, 12, 6, "#ffff00");
      }

      // 3. Render Froggy Pixel Sprite
      if (STATE.isSleeping) {
        // Bed with sleeping frog
        drawPixelRect(80, 80, 48, 26, P.black);
        ctx.strokeRect(80, 80, 48, 26);
        drawPixelRect(83, 76, 12, 8, P.white);
        drawPixelRect(92, 78, 14, 12, P.greenMain);
        drawPixelRect(94, 82, 3, 1, P.black);
        drawPixelRect(100, 82, 3, 1, P.black);
        drawPixelRect(96, 80, 30, 24, P.pinkTrim);
      } else {
        renderFrogSprite(frog.x, frog.y, frog.facing, frog.state, frog.animFrame);
      }

      requestAnimationFrame(renderScene);
    }

    function renderFrogSprite(fx, fy, facing, state, frame) {
      const legOffset = (state === "WALK") ? (Math.floor(frame / 6) % 2 === 0 ? 2 : -2) : 0;

      // Outer outline box
      drawPixelRect(fx, fy, 26, 36, P.outline);

      // Hood Base
      drawPixelRect(fx + 2, fy + 2, 22, 32, P.greenMain);
      drawPixelRect(fx + 2, fy + 2, 6, 32, P.greenDark);
      drawPixelRect(fx + 10, fy + 2, 12, 32, P.greenBright);

      // Hood Frog Eyes on top
      drawPixelRect(fx + 3, fy - 6, 7, 7, P.white);
      drawPixelRect(fx + 16, fy - 6, 7, 7, P.white);
      drawPixelRect(fx + 5, fy - 4, 3, 3, P.black);
      drawPixelRect(fx + 18, fy - 4, 3, 3, P.black);
      // Outlines on hood eyes
      drawPixelRect(fx + 3, fy - 6, 7, 1, P.outline);
      drawPixelRect(fx + 16, fy - 6, 7, 1, P.outline);

      // Peach Face Opening
      drawPixelRect(fx + 4, fy + 6, 18, 15, P.pinkTrim);
      drawPixelRect(fx + 6, fy + 8, 14, 11, P.skin);

      // Eyes
      drawPixelRect(fx + 8, fy + 10, 3, 4, P.black);
      drawPixelRect(fx + 15, fy + 10, 3, 4, P.black);

      // Cheeks
      drawPixelRect(fx + 5, fy + 14, 2, 2, P.pinkTrim);
      drawPixelRect(fx + 19, fy + 14, 2, 2, P.pinkTrim);

      // Yellow Belly with Pink Heart
      drawPixelRect(fx + 5, fy + 22, 16, 11, P.bellyYellow);
      drawPixelRect(fx + 10, fy + 24, 6, 6, P.bellyPink);

      // Stepping Feet (Animated Walk Cycle)
      drawPixelRect(fx + 3, fy + 35 + legOffset, 7, 3, P.greenDark);
      drawPixelRect(fx + 16, fy + 35 - legOffset, 7, 3, P.greenDark);
    }

    // Wandering AI Loop
    function updateWanderingAI() {
      if (STATE.isSleeping) return;

      frog.timer++;
      frog.animFrame++;

      if (frog.state === "IDLE") {
        if (frog.timer > 120) {
          // Pick new spot to walk to
          frog.targetX = 40 + Math.floor(Math.random() * 110);
          frog.state = "WALK";
          frog.facing = (frog.targetX > frog.x) ? 1 : -1;
          frog.timer = 0;
        }
      } else if (frog.state === "WALK") {
        const dx = frog.targetX - frog.x;
        if (Math.abs(dx) <= 1) {
          frog.x = frog.targetX;
          frog.state = "IDLE";
          frog.timer = 0;
        } else {
          frog.x += Math.sign(dx) * 0.8;
        }
      }
    }
    setInterval(updateWanderingAI, 30);
    renderScene();

    /* =========================================================================
       5. RELATABLE CASUAL BANTER DIALOGUE MATRIX
       ========================================================================= */
    const BANTER_TREE = [
      {
        text: "* Yo. Look at this green grid. Remind you of anything? Draw your flowchart before my timer hits zero!",
        c1: "I'm literally drawing it now.",
        r1: "* Good! Because turning into 8-bit dust on Sunday was NOT on my schedule.",
        c2: "Why are we in a battle grid?",
        r2: "* Because human communication IS a battle! Now equip your pencil and scan the paper."
      },
      {
        text: "* Pro-tip from Book 14: When someone tries to guilt-trip you, agree instantly. It breaks their combat rhythm.",
        c1: "Sounds like cheating.",
        r1: "* It's called psychological jujitsu. Stop taking damage from emotional vampires.",
        c2: "Does that work on you?",
        r2: "* Absolutely not. I'm a frog in a hoodie. I am completely immune to guilt."
      },
      {
        text: "* I've been pacing back and forth across this screen for 2 hours. My tiny pixel legs demand progress!",
        c1: "Take a break, buddy.",
        r1: "* I can't take a break! The curriculum has 30 tracks and you're still on Track 1!",
        c2: "I'll scan a note right now.",
        r2: "* That's what I like to hear! Hit [ FIGHT ] and show the camera your node tree."
      }
    ];

    let currentBanterIdx = 0;
    let typeTimer = null;

    function runTypewriter(text, onDone) {
      const box = document.getElementById("dialogue-text");
      box.innerHTML = "";
      clearTimeout(typeTimer);
      let i = 0;

      function step() {
        if (i < text.length) {
          box.innerHTML += text.charAt(i);
          if (/[a-zA-Z0-9]/.test(text.charAt(i))) playAudioBlip(160);
          i++;
          typeTimer = setTimeout(step, 20);
        } else {
          if (onDone) onDone();
        }
      }
      step();
    }

    function triggerDialogue(idx) {
      currentBanterIdx = idx % BANTER_TREE.length;
      const b = BANTER_TREE[currentBanterIdx];
      const choices = document.getElementById("dialogue-choices");
      choices.style.display = "none";

      runTypewriter(b.text, () => {
        document.getElementById("choice-1").innerText = b.c1;
        document.getElementById("choice-2").innerText = b.c2;
        choices.style.display = "flex";
      });
    }

    function makeChoice(opt) {
      playAudioBlip(420);
      const b = BANTER_TREE[currentBanterIdx];
      const reply = (opt === 1) ? b.r1 : b.r2;
      document.getElementById("dialogue-choices").style.display = "none";
      runTypewriter(reply);
    }

    /* =========================================================================
       6. UNDERTALE ACTION BUTTON HANDLERS
       ========================================================================= */
    function handleActMenu() {
      playAudioBlip(500);
      const cur = TRACKS[STATE.activeTrack];
      document.getElementById("ascii-mount").innerText = cur.blueprint;
      document.getElementById("blueprint-modal").style.display = "flex";
    }

    function handleItemMenu() {
      playAudioBlip(450);
      runTypewriter(`* INVENTORY: [Desk: ${STATE.highestTrack >= 1 ? 'EQUIPPED' : 'LOCKED'}] [Lamp: ${STATE.highestTrack >= 2 ? 'EQUIPPED' : 'LOCKED'}] [Tea: READY]`);
    }

    function handleMercyMenu() {
      playAudioBlip(300);
      document.getElementById("powers-mount").innerHTML = STATE.powers.length ? STATE.powers.map(p => `<div>* ${p}</div>`).join('') : "<div>* No powers earned yet! Clear a track 5/5.</div>";
      document.getElementById("powers-modal").style.display = "flex";
    }

    function closeModal(id) {
      playAudioBlip(250);
      document.getElementById(id).style.display = "none";
    }

    function pokeFrog() {
      playAudioBlip(600);
      triggerDialogue(Math.floor(Math.random() * BANTER_TREE.length));
    }

    /* =========================================================================
       7. PROGRESSION AND UI TRAY LOGIC
       ========================================================================= */
    let STATE = {
      activeTrack: 0,
      highestTrack: 0,
      checks: {},
      powers: [],
      isSleeping: false
    };

    function save() {
      try { localStorage.setItem("frog_undertale_battle_save", JSON.stringify(STATE)); } catch (e) {}
    }
    try {
      const s = localStorage.getItem("frog_undertale_battle_save");
      if (s) STATE = JSON.parse(s);
    } catch (e) {}

    function stepTrack(delta) {
      const next = STATE.activeTrack + delta;
      if (next < 0) return;
      if (next > STATE.highestTrack) {
        playAudioBlip(180);
        runTypewriter("* That track is LOCKED 🔒! Finish this week's 5 flowchart nodes first!");
        return;
      }
      playAudioBlip(400);
      STATE.activeTrack = next;
      STATE.isSleeping = false;
      save();
      refreshUI();
      runTypewriter(`* Loaded ${TRACKS[STATE.activeTrack].title}. Draw the blueprint on real paper!`);
    }

    function refreshUI() {
      const cur = TRACKS[STATE.activeTrack];
      document.getElementById("track-name").innerText = (STATE.activeTrack > STATE.highestTrack) ? `🔒 ${cur.title}` : cur.title;
      document.getElementById("nav-left").disabled = (STATE.activeTrack === 0);
      document.getElementById("nav-right").disabled = (STATE.activeTrack >= TRACKS.length - 1);

      if (!STATE.checks[cur.id]) STATE.checks[cur.id] = [false, false, false, false, false];
      const c = STATE.checks[cur.id];
      const done = c.filter(Boolean).length;

      document.getElementById("hud-level").innerText = STATE.activeTrack + 1;
      document.getElementById("hud-exp").innerText = done;

      const mount = document.getElementById("subcat-mount");
      mount.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `subcat-item ${c[idx] ? 'done' : ''}`;
        item.innerText = p.name;
        mount.appendChild(item);
      });
    }

    /* =========================================================================
       8. CAMERA OCR SCANNER & PROGRESSION VALIDATOR (FIGHT)
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      playAudioBlip(600);
      runTypewriter("* FIGHT! Scanning paper notes with neural OCR vision...");

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => runOCR(file);
        document.body.appendChild(s);
      } else {
        runOCR(file);
      }
    });

    async function runOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const text = res.data.text.toLowerCase();
        await worker.terminate();

        const cur = TRACKS[STATE.activeTrack];
        const checks = STATE.checks[cur.id];
        let found = 0;

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            const hasKeyword = part.kw.some(k => text.includes(k.toLowerCase()));
            const hasArrows = text.includes("->") || text.includes("-->") || text.includes("to");

            if (hasKeyword || hasArrows) {
              checks[idx] = true;
              found++;
            }
          }
        });

        const total = checks.filter(Boolean).length;
        if (total === 5) {
          STATE.isSleeping = true;
          if (!STATE.powers.includes(cur.powerBadge)) STATE.powers.push(cur.powerBadge);
          if (STATE.highestTrack === STATE.activeTrack) STATE.highestTrack++;
          runTypewriter(`* VICTORY! 5/5 verified! Superpower unlocked: [${cur.powerBadge}]! Froggy goes to sleep! 🛌`);
        } else if (found > 0) {
          runTypewriter(`* Hit! Recognized ${found} valid flowchart nodes! Total: ${total}/5 complete.`);
        } else {
          runTypewriter("* Miss! Could not detect flowchart arrows (->) or keywords. Draw cleaner nodes!");
        }

        save();
        refreshUI();
      } catch (err) {
        runTypewriter("* Error reading paper! Ensure bright lighting and hold camera steady.");
      }
    }

    // Launch!
    refreshUI();
    triggerDialogue(0);
  </script>
</body>
</html>
