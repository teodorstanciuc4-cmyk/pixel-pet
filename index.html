      color: var(--text);
      font-family: var(--font-code);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px 60px 12px;

    .meta-tag { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

      position: relative;
      width: 100%;
      max-width: 380px;
      height: 240px;
      background: #101322;
      border: 3px solid #232a45;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #stage-wrap svg {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: bold;
      line-height: 1.4;
      position: relative;
      min-height: 64px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #dialogue-container::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 9px 9px 9px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }

    .dashboard {
      width: 100%;
      max-width: 380px;
      margin-top: 14px;
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #232a45;

    .bar-bg { width: 100%; height: 8px; background: #202740; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

    .checklist { margin: 8px 0 12px 0; font-size: 0.72rem; }
    .check-item { display: flex; align-items: center; margin: 4px 0; color: #a0aec0; }
    .check-item.done { color: var(--success); font-weight: bold; }
    .check-item::before { content: '□ '; margin-right: 6px; }
    .check-item.done::before { content: '■ '; }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-family: var(--font-code);
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(93, 104, 209, 0.35);
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      border: 1px dashed #3a456d;
      color: #94a3b8;
      margin-top: 8px;
      padding: 9px;
      font-size: 0.72rem;
    }

    #gate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #090a10;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;

    #gate-screen p { color: #718096; font-size: 0.82rem; max-width: 310px; line-height: 1.5; }

      background: rgba(9, 11, 19, 0.94);
      flex-direction: column;
      justify-content: center;
      align-items: center;

      animation: spin 1.5s infinite linear;
      margin-bottom: 8px;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
