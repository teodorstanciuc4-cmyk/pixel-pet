<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Behavioral Companion • 400 Books</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelPet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Pixel Companion","short_name":"PixelPet","start_url":".","display":"standalone","background_color":"#090b13","theme_color":"#090b13"}'>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23131728'/><text y='70' font-size='65' x='17'>👾</text></svg>">

  <style>
    :root {
      --bg: #090b13;
      --panel: #131728;
      --accent: #5d68d1;
      --gold: #f4b251;
      --danger: #e54d42;
      --success: #39b54a;
      --text: #e2e8f0;
      --font-code: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-code);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px 60px 12px;
    }

    header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.05rem; color: var(--gold); letter-spacing: 1px; }
    .meta-tag { font-size: 0.68rem; color: #718096; margin-top: 2px; }

    #stage-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 240px;
      background: #101322;
      border: 3px solid #232a45;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; }

    #dialogue-container {
      margin-top: 10px;
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: bold;
      line-height: 1.4;
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #dialogue-container::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 9px 9px 9px;
      border-style: solid;
      border-color: transparent transparent #ffffff transparent;
    }

    .dashboard {
      width: 100%;
      max-width: 380px;
      margin-top: 14px;
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #232a45;
    }
    .metric-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 8px; background: #202740; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    .bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

    .checklist { margin: 8px 0 12px 0; font-size: 0.72rem; }
    .check-item { display: flex; align-items: center; margin: 4px 0; color: #a0aec0; }
    .check-item.done { color: var(--success); font-weight: bold; }
    .check-item::before { content: '□ '; margin-right: 6px; }
    .check-item.done::before { content: '■ '; }

    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-family: var(--font-code);
      font-weight: bold;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(93, 104, 209, 0.35);
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      border: 1px dashed #3a456d;
      color: #94a3b8;
      margin-top: 8px;
      padding: 9px;
      font-size: 0.72rem;
    }

    /* Lock Screen for 07.11.2026 */
    #gate-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #090a10;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #gate-screen h2 { color: var(--gold); margin-bottom: 8px; font-size: 1.2rem; }
    #gate-screen p { color: #718096; font-size: 0.82rem; max-width: 310px; line-height: 1.5; }

    #scanner-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(9, 11, 19, 0.92);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.78rem;
      color: var(--gold);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Gate screen shown if date is before 08.11.2026 -->
  <div id="gate-screen">
    <div style="font-size: 55px; margin-bottom: 16px;">⏳👾</div>
    <h2>STASIS LOCKOUT</h2>
    <p>Opening on <strong>08.11.2026</strong>.</p>
    <p style="margin-top: 8px; color: #a0aec0;">Today is 07.11.2026.<br>Launch countdown: <strong>1 Day remaining</strong>.</p>
    <button class="btn btn-secondary" style="margin-top: 24px;" onclick="bypassLock()">[Developer: Bypass Test Mode]</button>
  </div>

  <header>
    <h1>BEHAVIORAL COMPANION</h1>
    <div class="meta-tag">400 BOOKS • 30 DIMENSIONS • CALENDAR ENGINE</div>
  </header>

  <div id="stage-wrap">
    <canvas id="petCanvas" width="190" height="120"></canvas>
    <div id="scanner-modal">
      <div style="margin-bottom: 6px;">📷 SCANNING HOMEWORK NOTE...</div>
      <div id="ocr-status" style="font-size: 0.65rem; color: #94a3b8;">Processing paper...</div>
    </div>
  </div>

  <div id="dialogue-container">Running telemetry on your progress...</div>

  <div class="dashboard">
    <div class="metric-row">
      <span id="topic-label">Week 1: Values</span>
      <span id="score-label">0 / 5 Subcategories</span>
    </div>
    <div class="bar-bg">
      <div id="bar-fill" class="bar-fill"></div>
    </div>

    <div class="checklist" id="subcat-list"></div>

    <label for="camera-file" class="btn">
      📸 Scan Paper Homework
    </label>
    <input type="file" id="camera-file" accept="image/*" capture="environment" style="display: none;">

    <button class="btn btn-secondary" onclick="unlockBonusQuest()">
      🎁 Bonus Quest: Equip Blanket, Desk, or Hat
    </button>
  </div>

  <script>
    // 1. Topics Data
    const TOPICS = [
      { id: 1, title: "Values (Books 1–13)", parts: [
        { name: "Part 1: Core Diagnostic Probe", kw: ["non-negotiable", "metric", "specific element"] },
        { name: "Part 2: Decision Frame Check", kw: ["prioritize", "specific path", "choices"] },
        { name: "Part 3: SCARF Control Assessment", kw: ["structural control", "timeline", "status"] },
        { name: "Part 4: Bottleneck Verifier", kw: ["resolve", "immediate problem", "triggers"] },
        { name: "Part 5: Combined Matrix Outcome", kw: ["catalyst", "circuit-breaker", "framework"] }
      ]},
      { id: 2, title: "Roles (Books 14–26)", parts: [
        { name: "Part 1: Parent-to-Adult Logic", kw: ["data logs", "specific metrics", "control"] },
        { name: "Part 2: Drama Triangle Escape", kw: ["capacity", "handle this file", "options"] },
        { name: "Part 3: Insult Exhaustion", kw: ["entirely right", "improve", "speed"] },
        { name: "Part 4: Double-Bind Exposure", kw: ["choice a", "choice b", "timeline breaks"] },
        { name: "Part 5: Combined Matrix Outcome", kw: ["rational peers", "emotional shifting", "milestone"] }
      ]}
    ];

    // 2. Personality Dialogues
    const DIALOGUES = [
      "Running telemetry on your progress: The 400 books confirm consistency prevents entropy. Complete this week's 5 parts, or my core violently disassembles.",
      "Greetings! From an objective baseline: human communication follows rigid scripts. Let's finish your homework so I don't turn into a dramatic fireball.",
      "Checking our vital stats: We have 5 subcategories to verify. My little pixelated life depends on your paper notes. No pressure, of course.",
      "Fascinating behavioral variable observed: You opened the app! Now scan your homework notes before my cellular stability collapses."
    ];

    let STATE = {
      weekIndex: 0,
      checked: [false, false, false, false, false],
      hasBlanket: false,
      hasDesk: false,
      hasLamp: false,
      hasHat: false,
      isExploded: false,
      isSleeping: false
    };

    function save() {
      try { localStorage.setItem("pet_mentor_state_v3", JSON.stringify(STATE)); } catch(e) {}
    }
    try {
      const saved = localStorage.getItem("pet_mentor_state_v3");
      if (saved) STATE = JSON.parse(saved);
    } catch(e) {}

    // Check Lockout Gate
    function checkCalendar() {
      const now = new Date();
      // Target: 8th November 2026
      const launch = new Date("2026-11-08T00:00:00");
      if (now < launch && !sessionStorage.getItem("gate_pass")) {
        document.getElementById("gate-screen").style.display = "flex";
      } else {
        document.getElementById("gate-screen").style.display = "none";
      }
    }
    function bypassLock() {
      sessionStorage.setItem("gate_pass", "1");
      document.getElementById("gate-screen").style.display = "none";
      setBubble("Developer bypass granted. Systems operational!");
    }
    checkCalendar();

    // Pixel Canvas Loop
    const canvas = document.getElementById("petCanvas");
    const ctx = canvas.getContext("2d");
    let t = 0;
    let particles = [];

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      t++;

      // Floor & Wall
      ctx.fillStyle = "#161b2e";
      ctx.fillRect(0, 95, canvas.width, 30);
      ctx.fillStyle = "#252d4a";
      ctx.fillRect(0, 93, canvas.width, 2);

      // Bookshelf
      ctx.fillStyle = "#3d271d"; ctx.fillRect(10, 50, 26, 45);
      ctx.fillStyle = "#e54d42"; ctx.fillRect(12, 54, 22, 5);
      ctx.fillStyle = "#5d68d1"; ctx.fillRect(12, 61, 22, 5);
      ctx.fillStyle = "#f4b251"; ctx.fillRect(12, 68, 22, 5);
      ctx.fillStyle = "#39b54a"; ctx.fillRect(12, 75, 22, 5);

      // Unlocks
      if (STATE.hasDesk) {
        ctx.fillStyle = "#4a2e1b"; ctx.fillRect(130, 80, 45, 15);
        ctx.fillRect(134, 95, 4, 18); ctx.fillRect(167, 95, 4, 18);
        ctx.fillStyle = "#ffffff"; ctx.fillRect(140, 74, 6, 6);
      }
      if (STATE.hasLamp) {
        ctx.fillStyle = "#f4b251"; ctx.fillRect(160, 55, 12, 8);
        ctx.fillStyle = "#718096"; ctx.fillRect(165, 63, 2, 17);
      }

      // Sleeping State
      if (STATE.isSleeping) {
        ctx.fillStyle = "#4a2e1b"; ctx.fillRect(75, 75, 48, 20);
        ctx.fillStyle = "#e2e8f0"; ctx.fillRect(77, 72, 12, 8);
        ctx.fillStyle = "#5d68d1"; ctx.fillRect(85, 73, 14, 10);
        ctx.fillStyle = "#000"; ctx.fillRect(87, 77, 3, 1); ctx.fillRect(92, 77, 3, 1);
        ctx.fillStyle = STATE.hasBlanket ? "#9f7aea" : "#3182ce"; ctx.fillRect(90, 76, 33, 19);
        if (t % 50 < 25) {
          ctx.fillStyle = "#cbd5e1"; ctx.font = "10px monospace";
          ctx.fillText("Zzz...", 115, 65 - (t % 25) / 2);
        }
        requestAnimationFrame(renderLoop);
        return;
      }

      // Active Pet
      const bounce = Math.sin(t * 0.1) * 2;
      const px = 82;
      const py = 65 + bounce;
      const count = STATE.checked.filter(Boolean).length;
      const isSweating = count < 3 && count > 0;

      ctx.fillStyle = isSweating ? "#e54d42" : "#5d68d1";
      ctx.fillRect(px, py, 26, 24);
      ctx.fillRect(px + 3, py - 4, 4, 4);
      ctx.fillRect(px + 19, py - 4, 4, 4);

      // Eyes
      ctx.fillStyle = "#fff";
      ctx.fillRect(px + 4, py + 6, 6, 6);
      ctx.fillRect(px + 16, py + 6, 6, 6);
      ctx.fillStyle = "#000";
      const gaze = Math.sin(t * 0.04) > 0.4 ? 1 : 0;
      ctx.fillRect(px + 6 + gaze, py + 8, 3, 3);
      ctx.fillRect(px + 18 + gaze, py + 8, 3, 3);

      // Cheeks
      ctx.fillStyle = "rgba(244, 114, 182, 0.7)";
      ctx.fillRect(px + 2, py + 14, 3, 2);
      ctx.fillRect(px + 21, py + 14, 3, 2);

      // Hat & Blanket
      if (STATE.hasHat) {
        ctx.fillStyle = "#2d3748"; ctx.fillRect(px - 1, py - 4, 28, 3); ctx.fillRect(px + 4, py - 9, 18, 5);
      }
      if (STATE.hasBlanket) {
        ctx.fillStyle = "#9f7aea"; ctx.fillRect(px - 3, py + 10, 3, 14); ctx.fillRect(px + 26, py + 10, 3, 14);
      }
      if (isSweating) {
        ctx.fillStyle = "#63b3ed"; ctx.fillRect(px + 28, py + 2 + (t % 14), 2, 4);
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function setBubble(txt) {
      document.getElementById("dialogue-container").innerText = txt;
    }

    function refreshUI() {
      const current = TOPICS[STATE.weekIndex];
      document.getElementById("topic-label").innerText = `Week ${current.id}: ${current.title.split(' ')[0]}`;
      const total = STATE.checked.filter(Boolean).length;
      document.getElementById("score-label").innerText = `${total} / 5 Subcategories`;
      document.getElementById("bar-fill").style.width = `${(total / 5) * 100}%`;

      const list = document.getElementById("subcat-list");
      list.innerHTML = "";
      current.parts.forEach((p, i) => {
        const item = document.createElement("div");
        item.className = `check-item ${STATE.checked[i] ? 'done' : ''}`;
        item.innerText = p.name;
        list.appendChild(item);
      });
    }

    function unlockBonusQuest() {
      if (!STATE.hasBlanket) {
        STATE.hasBlanket = true;
        setBubble("🎁 Bonus Quest Unlocked! Equipped cozy blanket. Core insulation optimized!");
      } else if (!STATE.hasDesk) {
        STATE.hasDesk = true;
        setBubble("🎁 Bonus Quest Unlocked! Study desk & warm coffee deployed.");
      } else if (!STATE.hasLamp) {
        STATE.hasLamp = true;
        setBubble("🎁 Bonus Quest Unlocked! Reading lamp added to room.");
      } else if (!STATE.hasHat) {
        STATE.hasHat = true;
        setBubble("🎁 Bonus Quest Unlocked! D
