<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FROGGY • SANS PERSONALITY MATRIX</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelFrog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Retro Pixel Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --ut-black: #000000;
      --ut-white: #ffffff;
      --ut-orange: #ff9900;
      --ut-yellow: #ffff00;
      --ut-red: #ff0000;
      --ut-green-grid: #00aa44;
      --ut-gray: #444444;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
      shape-rendering: crispEdges;
    }

    body {
      background-color: var(--ut-black);
      color: var(--ut-white);
      font-family: var(--font-pixel);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 60px 6px;
      overflow-x: hidden;
    }

    .screen-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stasis-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.44rem;
      border: 3px solid var(--ut-white);
      padding: 6px 8px;
      margin-bottom: 6px;
      background: #000;
      color: var(--ut-yellow);
    }

    #arena-container {
      width: 100%;
      height: 215px;
      background: #000;
      border: 4px solid var(--ut-white);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    canvas#pixelCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }

    #dialogue-box {
      width: 100%;
      margin-top: 6px;
      background: #000;
      border: 4px solid var(--ut-white);
      padding: 10px;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .dialogue-text {
      font-size: 0.52rem;
      line-height: 1.6;
      color: var(--ut-white);
      min-height: 50px;
      word-break: break-word;
      text-transform: lowercase;
    }

    .dialogue-choices {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .choice-btn {
      flex: 1;
      background: #000;
      border: 2px solid var(--ut-white);
      color: var(--ut-yellow);
      font-family: var(--font-pixel);
      font-size: 0.44rem;
      padding: 6px 4px;
      cursor: pointer;
      text-align: left;
      line-height: 1.3;
      text-transform: lowercase;
    }
    .choice-btn::before { content: "❤️ "; color: var(--ut-red); }
    .choice-btn:active { background: var(--ut-orange); color: #000; }

    .ut-status-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.56rem;
      padding: 0 4px;
    }

    .hp-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hp-bar-box {
      width: 32px;
      height: 14px;
      background: var(--ut-red);
      position: relative;
    }

    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: var(--ut-yellow);
    }

    .action-button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .btn-undertale {
      background: #000;
      border: 3px solid var(--ut-orange);
      color: var(--ut-orange);
      font-family: var(--font-pixel);
      font-size: 0.52rem;
      padding: 10px 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-undertale:active { background: var(--ut-orange); color: #000; }

    .curriculum-tray {
      width: 100%;
      margin-top: 8px;
      border: 3px solid var(--ut-white);
      background: #000;
      padding: 8px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .nav-arrow {
      background: #000;
      border: 2px solid var(--ut-white);
      color: var(--ut-yellow);
      font-family: var(--font-pixel);
      font-size: 0.6rem;
      padding: 4px 10px;
      cursor: pointer;
    }
    .nav-arrow:disabled { color: var(--ut-gray); border-color: var(--ut-gray); }

    .track-title {
      font-size: 0.44rem;
      color: var(--ut-yellow);
      text-align: center;
      max-width: 250px;
      line-height: 1.4;
    }

    .subcat-list { margin-top: 6px; }
    .subcat-item {
      font-size: 0.42rem;
      padding: 6px;
      border: 1px solid #222;
      background: #050505;
      color: #aaa;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      line-height: 1.4;
    }
    .subcat-item:hover { border-color: var(--ut-orange); color: var(--ut-white); }
    .subcat-item.done { color: #00ff66; border-color: #00aa44; }
    .subcat-header-line::before { content: "[ ] "; margin-right: 4px; color: var(--ut-gray); }
    .subcat-item.done .subcat-header-line::before { content: "[*] "; color: var(--ut-yellow); }
    .subcat-book-tag { font-size: 0.36rem; color: #ff9900; margin-left: 14px; }

    .ut-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .ut-modal-box {
      width: 100%;
      max-width: 430px;
      background: #000;
      border: 4px solid var(--ut-white);
      padding: 10px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .subcat-selector-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }

    .subcat-pill-btn {
      background: #111;
      border: 1px solid #444;
      color: #aaa;
      font-family: var(--font-pixel);
      font-size: 0.38rem;
      padding: 5px;
      cursor: pointer;
    }
    .subcat-pill-btn.active {
      border-color: var(--ut-yellow);
      color: var(--ut-yellow);
      background: #222;
    }

    .ascii-blueprint {
      background: #050505;
      color: #00ff66;
      font-family: var(--font-pixel);
      font-size: 0.35rem;
      padding: 6px;
      border: 2px solid #333;
      white-space: pre;
      line-height: 1.4;
      margin: 6px 0;
      overflow-x: auto;
    }

    .rules-section {
      margin-top: 10px;
      border-top: 2px dashed #444;
      padding-top: 8px;
    }

    .rule-card {
      background: #080808;
      border: 1px solid #222;
      padding: 5px;
      margin-bottom: 5px;
      font-size: 0.38rem;
      line-height: 1.4;
    }
    .rule-title { color: var(--ut-yellow); margin-bottom: 2px; }
    .rule-desc { color: #88ffaa; }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <div class="stasis-header">
      <div id="countdown-label">START: 08.11.2026</div>
      <div>TIMER: <span id="stasis-timer" style="color:var(--ut-white);">--:--:--</span></div>
    </div>

    <div id="arena-container" onclick="pokeFrog()">
      <canvas id="pixelCanvas" width="200" height="130"></canvas>
    </div>

    <div id="dialogue-box">
      <div id="dialogue-text" class="dialogue-text">* ...</div>
      <div id="dialogue-choices" class="dialogue-choices" style="display: none;">
        <button id="choice-1" class="choice-btn" onclick="makeChoice(1)">Option A</button>
        <button id="choice-2" class="choice-btn" onclick="makeChoice(2)">Option B</button>
      </div>
    </div>

    <div class="ut-status-bar">
      <div>HUMAN LV <span id="hud-level">1</span></div>
      <div class="hp-container">
        <span>HP</span>
        <div class="hp-bar-box">
          <div class="hp-bar-fill"></div>
        </div>
        <span>20/20</span>
      </div>
      <div>EXP <span id="hud-exp" style="color:var(--ut-yellow);">0</span>/5</div>
    </div>

    <div class="action-button-grid">
      <label for="camera-input" class="btn-undertale" onclick="playAudioBlip(120)">
        <span>⚔️</span>
        <span>FIGHT</span>
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

      <button class="btn-undertale" onclick="handleActMenu()">
        <span>🗣</span>
        <span>ACT</span>
      </button>

      <button class="btn-undertale" onclick="handleItemMenu()">
        <span>🎒</span>
        <span>ITEM</span>
      </button>

      <button class="btn-undertale" onclick="handleMercyMenu()">
        <span>💔</span>
        <span>MERCY</span>
      </button>
    </div>

    <div class="curriculum-tray">
      <div class="nav-row">
        <button id="nav-left" class="nav-arrow" onclick="stepTrack(-1)">&lt;</button>
        <div id="track-name" class="track-title">TRACK 1: VALUES (BOOKS 1–13)</div>
        <button id="nav-right" class="nav-arrow" onclick="stepTrack(1)">&gt;</button>
      </div>

      <div class="subcat-list" id="subcat-mount"></div>
    </div>
  </div>

  <!-- ACT BLUEPRINT & 20 NON-NEGOTIABLE RULES MODAL -->
  <div id="blueprint-modal" class="ut-modal">
    <div class="ut-modal-box">
      <div style="font-size:0.48rem; color:var(--ut-yellow); margin-bottom:4px;">* SUBCATEGORY FLOWCHART & RULES</div>
      <p style="font-size:0.4rem; color:#aaa; line-height:1.4;">
        Pick a subcategory to inspect its assigned books and verification flowchart:
      </p>

      <div class="subcat-selector-bar" id="blueprint-tabs"></div>
      <div id="ascii-mount" class="ascii-blueprint"></div>

      <!-- 20 NON-NEGOTIABLE RULES REFERENCE -->
      <div class="rules-section">
        <div style="font-size:0.46rem; color:var(--ut-orange); margin-bottom:6px;">
          * 20 NON-NEGOTIABLE COMMUNICATION RULES
        </div>
        <div id="rules-mount"></div>
      </div>

      <button class="btn-undertale" style="width:100%; padding:8px; margin-top:8px;" onclick="closeModal('blueprint-modal')">
        * [ RETURN ]
      </button>
    </div>
  </div>

  <!-- MERCY / POWERS MODAL -->
  <div id="powers-modal" class="ut-modal">
    <div class="ut-modal-box">
      <div style="font-size:0.5rem; color:var(--ut-yellow); margin-bottom:6px;">* UNLOCKED POWERS</div>
      <div id="powers-mount" style="font-size:0.42rem; color:#00ff66; line-height:1.8; margin:8px 0;"></div>
      <button class="btn-undertale" style="width:100%; padding:8px;" onclick="closeModal('powers-modal')">
        * [ BACK ]
      </button>
    </div>
  </div>

  <script>
    /* 1. STATE INITIALIZATION */
    const STATE = {
      activeTrack: 0,
      highestTrack: 0,
      checks: {},
      powers: [],
      isSleeping: false,
      selectedSubcatIdx: 0
    };

    try {
      const saved = localStorage.getItem("frog_sans_master_save");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (typeof parsed === 'object' && parsed !== null) {
          Object.assign(STATE, parsed);
        }
      }
    } catch (e) {}

    function saveState() {
      try { localStorage.setItem("frog_sans_master_save", JSON.stringify(STATE)); } catch (e) {}
    }

    /* 2. AUDIO SYNTHESIS */
    let audioContext = null;
    function getAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playSansVoiceBlip() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(82 + (Math.random() * 8), ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function playAudioBlip(freq = 120) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function playTrombonePun() {
      const notes = [311.13, 293.66, 277.18, 261.63];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          try {
            const ctx = getAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.07, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.22);
          } catch(e) {}
        }, i * 220);
      });
    }

    /* 3. CALENDAR & DEADLINE ENGINE */
    const LAUNCH_DATE = new Date("2026-11-08T00:00:00");

    function updateCalendarSchedule() {
      const now = new Date();
      const diffToLaunch = LAUNCH_DATE - now;

      if (diffToLaunch > 0 && !sessionStorage.getItem("frog_bypass_active")) {
        document.getElementById("countdown-label").innerText = "START: 08.11.2026";
        const d = Math.floor(diffToLaunch / (1000 * 60 * 60 * 24));
        const h = Math.floor((diffToLaunch / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diffToLaunch / (1000 * 60)) % 60);
        const s = Math.floor((diffToLaunch / 1000) % 60);
        document.getElementById("stasis-timer").innerText = `${d}d ${h}h ${m}m ${s}s`;
      } else {
        document.getElementById("countdown-label").innerText = "WEEK DEADLINE (SUN)";
        const dayOfWeek = now.getDay();
        const daysUntilNextSunday = (7 - dayOfWeek) % 7;
        const nextSundayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilNextSunday, 23, 59, 59);
        const diffMs = nextSundayEnd - now;

        if (diffMs > 0) {
          const d = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          const h = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
          const m = Math.floor((diffMs / (1000 * 60)) % 60);
          document.getElementById("stasis-timer").innerText = `${d}d ${h}h ${m}m`;
        } else {
          document.getElementById("stasis-timer").innerText = `WEEK RESET`;
        }
      }
    }
    setInterval(updateCalendarSchedule, 1000);
    updateCalendarSchedule();

    /* =========================================================================
       4. 20 NON-NEGOTIABLE COMMUNICATION RULES & MEANINGS
       ========================================================================= */
    const NON_NEGOTIABLE_RULES = [
      { id: 1, name: "Emotion Precedes Logic", meaning: "A person in emotional hijack cannot process rational facts. Lower heart rate before arguing data." },
      { id: 2, name: "Adult-to-Adult State Lock", meaning: "Never reply to Child tantrum or Parent judgment with emotion; answer purely in calm adult inquiry." },
      { id: 3, name: "The SCARF Status Shield", meaning: "Attacking someone's status triggers visceral threat. Protect their standing before presenting a flaw." },
      { id: 4, name: "Isolate the Noise Word", meaning: "Ignore subjective insults ('you always'); extract and solve the single operational bottleneck." },
      { id: 5, name: "Framing Controls the Outcome", meaning: "The person who establishes the frame of reference dictates the acceptable solutions." },
      { id: 6, name: "Non-Violent Specificity", meaning: "Replace moral judgments with unarguable camera observations and time-bound requests." },
      { id: 7, name: "Tactical Silence Pressure", meaning: "Pausing 3 to 4 seconds after an outburst transfers the psychological burden back to the speaker." },
      { id: 8, name: "Dynamic Labeling Defusal", meaning: "Labeling their emotion ('It seems like you feel unheard') immediately neutralizes amygdala flare-ups." },
      { id: 9, name: "Autonomy Preservation", meaning: "Humans instinctively resist commands. Offer two constrained choices to preserve their agency." },
      { id: 10, name: "Identity Insulation", meaning: "Critique the output or system, never the individual's inherent identity, talent, or worth." },
      { id: 11, name: "Certainty Anchoring", meaning: "Ambiguity breeds paranoia. Clearly outline exact milestones, boundaries, and next checkpoints." },
      { id: 12, name: "Fairness Parity", meaning: "Perceived unfairness triggers stronger negative pain than physical loss. Equalize terms explicitly." },
      { id: 13, name: "Relatedness In-Group Bridge", meaning: "If viewed as out-group, your best offer is rejected. Establish shared tribal stakes first." },
      { id: 14, name: "Circuit-Breaker Recess", meaning: "When emotional friction spikes past tolerance delta, execute a hard 15-minute recess." },
      { id: 15, name: "Proactive Accusation Audit", meaning: "List every negative thought they could harbor against you upfront before they can weaponize it." },
      { id: 16, name: "Sunk Cost Decoupling", meaning: "Never let past lost resources justify continuing an operational dead-end. Evaluate current reality only." },
      { id: 17, name: "Priming Trap Neutralization", meaning: "The first metric mentioned anchors everything. Counter-anchor immediately with verifiable criteria." },
      { id: 18, name: "Confirmation Bias Bypass", meaning: "Ask 'What condition would prove your plan wrong?' rather than attacking their existing beliefs." },
      { id: 19, name: "70/30 Active Inquiry Ratio", meaning: "Spend 70% of conversation gathering diagnostic input and 30% calibrating the solution." },
      { id: 20, name: "Mutual Synthesis Closure", meaning: "Never close a loop without mutual, recorded, written verification criteria for completion." }
    ];

    /* =========================================================================
       5. 30 TRACKS (400 BOOKS DISTRIBUTED ACROSS SUBCATEGORIES)
       ========================================================================= */
    const TRACK_NAMES = [
      "Values", "Roles", "Traits", "Framing", "States", "Conversation Loops",
      "Fear", "Anger", "Shame", "Pride", "Desire", "Active Listening",
      "Compliance", "Command", "Biases", "Habit Anchors", "Attention Traps", "Status Shields",
      "Certainty Anchors", "Autonomy Preserves", "Relatedness Ties", "Fairness Audits", "Deception Reads", "Confrontation Defusals",
      "Accusation Cleansers", "Persuasion Primes", "Vulnerability Wedges", "Impression Facades", "Insulation Controls", "System Synthesis"
    ];

    const TRACKS = TRACK_NAMES.map((name, i) => {
      const startBook = 1 + (i * 13);
      const endBook = Math.min(400, 13 + (i * 13));

      // 13 books mapped specifically across the 5 subcategories
      const parts = [
        {
          name: "Part 1: Core Diagnostic Probe",
          books: `Books ${startBook}–${startBook + 2}`,
          ruleAnchor: NON_NEGOTIABLE_RULES[(i * 2) % 20],
          kw: ["diagnostic", "probe", "metric", "element", "non-negotiable"],
          input1: `${name} Raw Utterance`,
          input2: `Diagnostic Metric (Bk ${startBook})`,
          decision: `Criteria Matched?`,
          trueStatement: `Lock Non-Negotiable Criterion`,
          falseStatement: `Trigger Active Inquiry Loop`
        },
        {
          name: "Part 2: Decision Frame Check",
          books: `Books ${startBook + 3}–${startBook + 4}`,
          ruleAnchor: NON_NEGOTIABLE_RULES[(i * 2 + 1) % 20],
          kw: ["frame", "decision", "prioritize", "choices", "pathway"],
          input1: `Stakeholder Frame (Bk ${startBook + 3})`,
          input2: `Alternative Paths`,
          decision: `Aligns to Primary Value?`,
          trueStatement: `Prioritize Optimal Pathway`,
          falseStatement: `Invert Comparison Frame`
        },
        {
          name: "Part 3: SCARF Control Assessment",
          books: `Books ${startBook + 5}–${startBook + 7}`,
          ruleAnchor: NON_NEGOTIABLE_RULES[(i * 2 + 2) % 20],
          kw: ["scarf", "status", "threat", "autonomy", "control"],
          input1: `Status/Certainty Check`,
          input2: `Autonomy Vector (Bk ${startBook + 5})`,
          decision: `Threat Delta Detected?`,
          trueStatement: `Deploy Status Shield Anchor`,
          falseStatement: `Sustain Conversational Parity`
        },
        {
          name: "Part 4: Bottleneck Verifier",
          books: `Books ${startBook + 8}–${startBook + 9}`,
          ruleAnchor: NON_NEGOTIABLE_RULES[(i * 2 + 3) % 20],
          kw: ["bottleneck", "friction", "breaker", "resolve", "trigger"],
          input1: `Friction Frequency`,
          input2: `Bottleneck Node (Bk ${startBook + 8})`,
          decision: `Friction > Threshold?`,
          trueStatement: `Execute Circuit-Breaker Recess`,
          falseStatement: `Resolve Immediate Node`
        },
        {
          name: "Part 5: Combined Matrix Outcome",
          books: `Books ${startBook + 10}–${endBook}`,
          ruleAnchor: NON_NEGOTIABLE_RULES[(i * 2 + 4) % 20],
          kw: ["matrix", "synthesis", "catalyst", "framework", "closure"],
          input1: `Evidence Log (Bk ${startBook + 10})`,
          input2: `Synthesis Weights (Bk ${endBook})`,
          decision: `Synthesis Complete (5/5)?`,
          trueStatement: `Seal Final Action Matrix`,
          falseStatement: `Iterate Diagnostic Probe`
        }
      ];

      return {
        id: i + 1,
        name: name,
        title: `TRACK ${i + 1}: ${name.toUpperCase()} (BOOKS ${startBook}–${endBook})`,
        powerBadge: `${name} Mastery Matrix`,
        parts: parts
      };
    });

    function buildCustomFlowchartASCII(trackName, sub) {
      return `   +------------------------------------+
   |              ( START )             |
   +-----------------+------------------+
                     |
                     v
   /------------------------------------\\
  /  [/ INPUT 1 /]:                      \\
 /   ${sub.input1.padEnd(34, ' ')} /
+------------------------------------+
                     |
                     v
   /------------------------------------\\
  /  [/ INPUT 2 /]:                      \\
 /   ${sub.input2.padEnd(34, ' ')} /
+------------------------------------+
                     |
                     v
             /\\                
            /  \\               
           /    \\              
    < ${sub.decision.padEnd(20, ' ')} >
           \\    /              
            \\  /   --[ True ]-->+----------------------------------+
             \\/                 | [/ STATEMENT 2 /]:               |
             |                  | ${sub.trueStatement.padEnd(32, ' ')} |
          [ False ]             +----------------+-----------------+
             |                                   |
             v                                   |
+----------------------------------+             |
| [/ STATEMENT 1 /]:               |             |
| ${sub.falseStatement.padEnd(32, ' ')} |             |
+----------------+-----------------+             |
                 |                               |
                 +---------------+---------------+
                                 |
                                 v
   +-----------------------------+------+
   |               ( STOP )             |
   +------------------------------------+
   * TRACK: ${trackName} | ${sub.books}
   * RULE: [Rule ${sub.ruleAnchor.id}] ${sub.ruleAnchor.name}`;
    }

    /* 6. ORIGINAL FROGGY SPRITE ENGINE */
    const canvas = document.getElementById("pixelCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const frog = {
      x: 88,
      y: 72,
      targetX: 88,
      facing: 1,
      state: "IDLE",
      face: "GRIN",
      timer: 0,
      animFrame: 0,
      isMouthOpen: false
    };

    const P = {
      black: "#000000",
      outline: "#15181f",
      greenDark: "#025433",
      greenMain: "#00a86b",
      greenBright: "#00e699",
      pinkTrim: "#ff597b",
      skin: "#fcd5a0",
      bellyYellow: "#fce373",
      bellyPink: "#e83a82",
      white: "#ffffff",
      gridGreen: "#005522"
    };

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function renderScene() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = P.gridGreen;
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Bookshelf
      drawPixelRect(8, 60, 24, 48, P.black);
      ctx.strokeStyle = P.white;
      ctx.strokeRect(8, 60, 24, 48);
      drawPixelRect(11, 65, 18, 5, "#ff4757");
      drawPixelRect(11, 74, 18, 5, "#00a86b");
      drawPixelRect(11, 83, 18, 5, "#fce373");
      drawPixelRect(11, 92, 18, 5, "#ff597b");

      // Desk & Lamp Unlocks
      if (STATE.highestTrack >= 1) {
        drawPixelRect(150, 84, 42, 24, P.black);
        ctx.strokeRect(150, 84, 42, 24);
        drawPixelRect(156, 76, 8, 8, P.white);
      }
      if (STATE.highestTrack >= 2) {
        drawPixelRect(178, 60, 2, 24, P.white);
        drawPixelRect(173, 54, 12, 6, "#ffff00");
      }

      // Sprite
      if (STATE.isSleeping) {
        drawPixelRect(80, 80, 48, 26, P.black);
        ctx.strokeStyle = P.white;
        ctx.strokeRect(80, 80, 48, 26);
        drawPixelRect(83, 76, 12, 8, P.white);
        drawPixelRect(92, 78, 14, 12, P.greenMain);
        drawPixelRect(94, 82, 3, 1, P.black);
        drawPixelRect(100, 82, 3, 1, P.black);
        drawPixelRect(96, 80, 30, 24, P.pinkTrim);
      } else {
        renderFrogSprite(frog.x, frog.y, frog.face, frog.animFrame, frog.isMouthOpen);
      }

      requestAnimationFrame(renderScene);
    }

    function renderFrogSprite(fx, fy, face, frame, mouthOpen) {
      const legOffset = (frog.state === "WALK") ? (Math.floor(frame / 6) % 2 === 0 ? 2 : -2) : 0;
      const shrugOffset = (face === "SHRUG") ? -3 : 0;

      drawPixelRect(fx, fy + shrugOffset, 26, 36, P.outline);
      drawPixelRect(fx + 2, fy + 2 + shrugOffset, 22, 32, P.greenMain);
      drawPixelRect(fx + 2, fy + 2 + shrugOffset, 6, 32, P.greenDark);
      drawPixelRect(fx + 10, fy + 2 + shrugOffset, 12, 32, P.greenBright);

      drawPixelRect(fx + 3, fy - 6 + shrugOffset, 7, 7, P.white);
      drawPixelRect(fx + 16, fy - 6 + shrugOffset, 7, 7, P.white);

      if (face === "EMPTY") {
        drawPixelRect(fx + 3, fy - 6 + shrugOffset, 7, 7, P.black);
        drawPixelRect(fx + 16, fy - 6 + shrugOffset, 7, 7, P.black);
      } else {
        drawPixelRect(fx + 5, fy - 4 + shrugOffset, 3, 3, P.black);
        drawPixelRect(fx + 18, fy - 4 + shrugOffset, 3, 3, P.black);
      }

      drawPixelRect(fx + 4, fy + 6 + shrugOffset, 18, 15, P.pinkTrim);
      drawPixelRect(fx + 6, fy + 8 + shrugOffset, 14, 11, P.skin);

      if (face === "EMPTY") {
        drawPixelRect(fx + 8, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      } else if (face === "WINK") {
        drawPixelRect(fx + 8, fy + 11 + shrugOffset, 4, 2, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      } else if (face === "DERP") {
        drawPixelRect(fx + 6, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 13, fy + 10 + shrugOffset, 3, 4, P.black);
      } else {
        drawPixelRect(fx + 8, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      }

      drawPixelRect(fx + 5, fy + 14 + shrugOffset, 2, 2, P.pinkTrim);
      drawPixelRect(fx + 19, fy + 14 + shrugOffset, 2, 2, P.pinkTrim);

      if (mouthOpen) {
        drawPixelRect(fx + 11, fy + 16 + shrugOffset, 5, 3, P.black);
      } else {
        drawPixelRect(fx + 10, fy + 17 + shrugOffset, 7, 1, P.black);
      }

      drawPixelRect(fx + 5, fy + 22 + shrugOffset, 16, 11, P.bellyYellow);
      drawPixelRect(fx + 10, fy + 24 + shrugOffset, 6, 6, P.bellyPink);

      if (face === "SHRUG") {
        drawPixelRect(fx - 4, fy + 16, 5, 6, P.greenMain);
        drawPixelRect(fx + 25, fy + 16, 5, 6, P.greenMain);
      }

      drawPixelRect(fx + 3, fy + 35 + legOffset, 7, 3, P.greenDark);
      drawPixelRect(fx + 16, fy + 35 - legOffset, 7, 3, P.greenDark);
    }

    function updateWanderingAI() {
      if (STATE.isSleeping) return;
      frog.timer++;
      frog.animFrame++;

      if (frog.state === "IDLE") {
        if (frog.timer > 120) {
          frog.targetX = 35 + Math.floor(Math.random() * 115);
          frog.state = "WALK";
          frog.facing = (frog.targetX > frog.x) ? 1 : -1;
          frog.timer = 0;
        }
      } else if (frog.state === "WALK") {
        const dx = frog.targetX - frog.x;
        if (Math.abs(dx) <= 1) {
          frog.x = frog.targetX;
          frog.state = "IDLE";
          frog.timer = 0;
        } else {
          frog.x += Math.sign(dx) * 0.75;
        }
      }
    }
    setInterval(updateWanderingAI, 30);
    renderScene();

    /* 7. DIALOGUE SYSTEM (SANS PERSONALITY PRESERVED) */
    const SANS_BANTER = [
      {
        text: "* heya. what're you sweating about? week 1 doesn't even launch until 08.11.2026. take a nap, kiddo.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 20, f: "WINK"}, {at: 55, f: "SHRUG"} ],
        c1: "aren't we supposed to prepare?",
        r1: "* prepare? i'm already a professional at doing nothing. inspect the flowcharts below.",
        c2: "tell me a psychology pun.",
        r2: "* why did the skeleton fail his behavioral diagnostic? he didn't have the *guts* to state his non-negotiable."
      },
      {
        text: "* you know, human communication is kinda funny. people would rather argue for 4 hours about the dishes than admit they're tired.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 30, f: "DERP"}, {at: 70, f: "EMPTY"} ],
        c1: "that's just human nature.",
        r1: "* nah, pal. that's just avoiding the adult logic pivot. Book 14 literally solves that in 5 minutes.",
        c2: "you ever do the dishes?",
        r2: "* i'm a pixel frog wearing a green hoodie. dishes are physically outside my collision box."
      },
      {
        text: "* a week starts on sunday and finishes on sunday. until 08.11.2026 hits, consider yourself on paid vacation.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 35, f: "WINK"}, {at: 65, f: "SHRUG"} ],
        c1: "can i test the scanner anyway?",
        r1: "* go right ahead, kiddo. hit [ FIGHT ] and show me your paper flowchart.",
        c2: "what's with the green grid?",
        r2: "* cozy, right? makes me feel like dodging attacks from a sentient flower."
      }
    ];

    let currentBanterIdx = 0;
    let typeTimer = null;

    function runTypewriterWithFaces(item, onDone) {
      const box = document.getElementById("dialogue-text");
      box.innerHTML = "";
      clearTimeout(typeTimer);
      let i = 0;
      const fullText = item.text;
      const plan = item.facePlan || [{at: 0, f: "GRIN"}];

      function step() {
        if (i < fullText.length) {
          plan.forEach(p => {
            if (i === p.at) frog.face = p.f;
          });

          box.innerHTML += fullText.charAt(i);

          if (/[a-zA-Z0-9]/.test(fullText.charAt(i))) {
            playSansVoiceBlip();
            frog.isMouthOpen = !frog.isMouthOpen;
          }

          i++;
          typeTimer = setTimeout(step, 24);
        } else {
          frog.isMouthOpen = false;
          frog.face = "GRIN";
          if (onDone) onDone();
        }
      }
      step();
    }

    function triggerDialogue(idx) {
      currentBanterIdx = idx % SANS_BANTER.length;
      const b = SANS_BANTER[currentBanterIdx];
      const choices = document.getElementById("dialogue-choices");
      choices.style.display = "none";

      runTypewriterWithFaces(b, () => {
        document.getElementById("choice-1").innerText = b.c1;
        document.getElementById("choice-2").innerText = b.c2;
        choices.style.display = "flex";
      });
    }

    function makeChoice(opt) {
      playAudioBlip(320);
      const b = SANS_BANTER[currentBanterIdx];
      const reply = (opt === 1) ? b.r1 : b.r2;
      document.getElementById("dialogue-choices").style.display = "none";

      if (reply.includes("guts") || reply.includes("dishes")) {
        setTimeout(playTrombonePun, 600);
      }

      runTypewriterWithFaces({ text: reply, facePlan: [{at: 0, f: "WINK"}, {at: 30, f: "EMPTY"}, {at: 60, f: "GRIN"}] });
    }

    function pokeFrog() {
      playAudioBlip(440);
      triggerDialogue(Math.floor(Math.random() * SANS_BANTER.length));
    }

    /* 8. ACT BLUEPRINT & 20 NON-NEGOTIABLE RULES */
    function handleActMenu(subIndex = 0) {
      playAudioBlip(380);
      const curTrack = TRACKS[STATE.activeTrack];
      STATE.selectedSubcatIdx = subIndex;

      // Render Subcategory Tabs
      const tabsMount = document.getElementById("blueprint-tabs");
      tabsMount.innerHTML = "";

      curTrack.parts.forEach((p, idx) => {
        const btn = document.createElement("button");
        btn.className = `subcat-pill-btn ${idx === STATE.selectedSubcatIdx ? 'active' : ''}`;
        btn.innerText = `Part ${idx + 1} (${p.books})`;
        btn.onclick = () => {
          playAudioBlip(240);
          handleActMenu(idx);
        };
        tabsMount.appendChild(btn);
      });

      // Flowchart Display
      const selectedPart = curTrack.parts[STATE.selectedSubcatIdx];
      const asciiDiagram = buildCustomFlowchartASCII(curTrack.name, selectedPart);
      document.getElementById("ascii-mount").innerText = asciiDiagram;

      // Populate 20 Non-Negotiable Rules List
      const rulesMount = document.getElementById("rules-mount");
      rulesMount.innerHTML = "";
      NON_NEGOTIABLE_RULES.forEach(r => {
        const div = document.createElement("div");
        div.className = "rule-card";
        div.innerHTML = `<div class="rule-title">* Rule ${r.id}: ${r.name}</div><div class="rule-desc">${r.meaning}</div>`;
        rulesMount.appendChild(div);
      });

      document.getElementById("blueprint-modal").style.display = "flex";
    }

    function handleItemMenu() {
      playAudioBlip(350);
      runTypewriterWithFaces({
        text: `* items: [desk: ${STATE.highestTrack >= 1 ? 'equipped' : 'locked'}] [lamp: ${STATE.highestTrack >= 2 ? 'equipped' : 'locked'}] [bottle of ketchup: empty]`,
        facePlan: [{at: 0, f: "WINK"}, {at: 50, f: "SHRUG"}]
      });
    }

    function handleMercyMenu() {
      playAudioBlip(280);
      document.getElementById("powers-mount").innerHTML = STATE.powers.length
        ? STATE.powers.map(p => `<div>* ${p}</div>`).join('')
        : "<div>* no powers yet, kiddo. finish a track 5/5 first.</div>";
      document.getElementById("powers-modal").style.display = "flex";
    }

    function closeModal(id) {
      playAudioBlip(220);
      document.getElementById(id).style.display = "none";
    }

    /* 9. PROGRESSION TRACKS ENGINE */
    function stepTrack(delta) {
      const next = STATE.activeTrack + delta;
      if (next < 0) return;
      if (next > STATE.highestTrack) {
        playAudioBlip(140);
        runTypewriterWithFaces({
          text: "* hold on, kiddo. that track is locked 🔒. no skipping steps on my watch.",
          facePlan: [{at: 0, f: "EMPTY"}, {at: 30, f: "WINK"}]
        });
        return;
      }
      playAudioBlip(320);
      STATE.activeTrack = next;
      STATE.isSleeping = false;
      saveState();
      refreshUI();
      runTypewriterWithFaces({
        text: `* loaded ${TRACKS[STATE.activeTrack].title}. check the blueprint and get your notes ready.`,
        facePlan: [{at: 0, f: "GRIN"}]
      });
    }

    function refreshUI() {
      const cur = TRACKS[STATE.activeTrack];
      document.getElementById("track-name").innerText = (STATE.activeTrack > STATE.highestTrack) ? `🔒 ${cur.title}` : cur.title;
      document.getElementById("nav-left").disabled = (STATE.activeTrack === 0);
      document.getElementById("nav-right").disabled = (STATE.activeTrack >= TRACKS.length - 1);

      if (!STATE.checks[cur.id]) STATE.checks[cur.id] = [false, false, false, false, false];
      const c = STATE.checks[cur.id];
      const done = c.filter(Boolean).length;

      document.getElementById("hud-level").innerText = STATE.activeTrack + 1;
      document.getElementById("hud-exp").innerText = done;

      const mount = document.getElementById("subcat-mount");
      mount.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `subcat-item ${c[idx] ? 'done' : ''}`;
        item.innerHTML = `
          <div class="subcat-header-line">${p.name}</div>
          <div class="subcat-book-tag">📖 ${p.books} | Rule ${p.ruleAnchor.id}</div>
        `;
        item.onclick = () => handleActMenu(idx);
        mount.appendChild(item);
      });
    }

    /* =========================================================================
       10. OCR VALIDATOR WITH EXACT "WHERE IT FAILED" FEEDBACK
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      playAudioBlip(440);
      runTypewriterWithFaces({
        text: "* fight! scanning paper notes with neural ocr vision...",
        facePlan: [{at: 0, f: "DERP"}]
      });

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => runOCR(file);
        document.body.appendChild(s);
      } else {
        runOCR(file);
      }
    });

    async function runOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const text = res.data.text.toLowerCase().trim();
        await worker.terminate();

        const cur = TRACKS[STATE.activeTrack];
        const checks = STATE.checks[cur.id];
        let found = 0;
        let missingParts = [];

        // Check for flowchart connector arrows
        const hasArrows = text.includes("->") || text.includes("-->") || text.includes("=>") || text.includes("to") || text.includes(">");

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            const hasKeyword = part.kw.some(k => text.includes(k.toLowerCase()));
            const hasRuleMatch = text.includes(`rule ${part.ruleAnchor.id}`) || text.includes(part.ruleAnchor.name.toLowerCase());

            if (hasArrows && (hasKeyword || hasRuleMatch)) {
              checks[idx] = true;
              found++;
            } else {
              missingParts.push({ partIdx: idx + 1, name: part.name, books: part.books, kw: part.kw[0] });
            }
          }
        });

        const total = checks.filter(Boolean).length;

        // SPECIFIC DIAGNOSTIC FEEDBACK: TELL THEM WHERE IT FAILED
        if (total === 5) {
          STATE.isSleeping = true;
          if (!STATE.powers.includes(cur.powerBadge)) STATE.powers.push(cur.powerBadge);
          if (STATE.highestTrack === STATE.activeTrack) STATE.highestTrack++;
          runTypewriterWithFaces({
            text: `* nice work, kiddo. 5/5 verified. unlocked [${cur.powerBadge}]. time for a well-deserved nap. 🛌`,
            facePlan: [{at: 0, f: "WINK"}, {at: 40, f: "GRIN"}]
          });
        } else if (!hasArrows) {
          // Failure Reason 1: No flowchart arrows drawn
          runTypewriterWithFaces({
            text: "* miss! where are your arrows? couldn't detect (->) connectors. connect your boxes so i know where the logic flows, kiddo.",
            facePlan: [{at: 0, f: "DERP"}]
          });
        } else if (found > 0) {
          // Success on some, pinpoint next failure
          const nextFail = missingParts[0];
          runTypewriterWithFaces({
            text: `* hit! recognized ${found} node(s) (${total}/5). but Part ${nextFail.partIdx} (${nextFail.books}) is still missing '${nextFail.kw}'. check act tab.`,
            facePlan: [{at: 0, f: "GRIN"}]
          });
        } else if (text.length < 10) {
          // Failure Reason 2: Blurry/Empty Photo
          runTypewriterWithFaces({
            text: "* miss! couldn't read any clear text on the paper. check your lighting and hold the camera steady, kiddo.",
            facePlan: [{at: 0, f: "SHRUG"}]
          });
        } else {
          // Failure Reason 3: Flowchart failed specific subcategory criteria
          const firstFail = missingParts[0];
          runTypewriterWithFaces({
            text: `* miss on Part ${firstFail.partIdx} (${firstFail.books})! missing criteria for [${firstFail.kw}]. check your condition node in act.`,
            facePlan: [{at: 0, f: "EMPTY"}]
          });
        }

        saveState();
        refreshUI();
      } catch (err) {
        runTypewriterWithFaces({
          text: "* error reading paper! hold camera steady with good lighting.",
          facePlan: [{at: 0, f: "SHRUG"}]
        });
      }
    }

    refreshUI();
    triggerDialogue(0);
  </script>
