<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FROGGY • SANS MATRIX</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelFrog">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --orange: #ff9900;
      --yellow: #ffff00;
      --red: #ff0000;
      --green: #00aa44;
      --gray: #444444;
      --font: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 6px 20px 6px;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Minimal Header */
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.38rem;
      border: 2px solid var(--white);
      padding: 5px 8px;
      margin-bottom: 6px;
      color: var(--yellow);
    }

    /* Arena */
    #arena {
      width: 100%;
      height: 190px;
      background: #000;
      border: 3px solid var(--white);
      position: relative;
      cursor: pointer;
    }

    canvas#pixelCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Dialogue */
    #dialogue-box {
      width: 100%;
      margin-top: 6px;
      background: #000;
      border: 3px solid var(--white);
      padding: 8px;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dialogue-text {
      font-size: 0.46rem;
      line-height: 1.6;
      color: var(--white);
      min-height: 44px;
      word-break: break-word;
      text-transform: lowercase;
    }

    .dialogue-choices {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .choice-btn {
      width: 100%;
      background: #000;
      border: 1px solid var(--white);
      color: var(--yellow);
      font-family: var(--font);
      font-size: 0.37rem;
      padding: 5px 6px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      text-transform: lowercase;
    }
    .choice-btn::before { content: "❤️ "; color: var(--red); }
    .choice-btn:active { background: var(--orange); color: #000; }

    /* Minimal Undertale Status */
    .status-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.48rem;
      padding: 0 4px;
    }

    .hp-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hp-bar {
      width: 28px;
      height: 11px;
      background: var(--red);
    }

    .hp-fill {
      width: 100%;
      height: 100%;
      background: var(--yellow);
    }

    /* 4 Buttons */
    .btn-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .btn-action {
      background: #000;
      border: 2px solid var(--orange);
      color: var(--orange);
      font-family: var(--font);
      font-size: 0.46rem;
      padding: 8px 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .btn-action:active { background: var(--orange); color: #000; }

    /* Clean Track Tray */
    .tray {
      width: 100%;
      margin-top: 6px;
      border: 2px solid var(--white);
      background: #000;
      padding: 6px;
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .nav-btn {
      background: #000;
      border: 1px solid var(--white);
      color: var(--yellow);
      font-family: var(--font);
      font-size: 0.50rem;
      padding: 2px 7px;
      cursor: pointer;
    }
    .nav-btn:disabled { color: var(--gray); border-color: var(--gray); }

    .track-title {
      font-size: 0.38rem;
      color: var(--yellow);
      text-align: center;
      max-width: 260px;
    }

    .subcat-list { margin-top: 4px; }
    .subcat-row {
      font-size: 0.36rem;
      padding: 4px;
      border: 1px solid #1a1a1a;
      background: #050505;
      color: #888;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .subcat-row:hover { border-color: var(--orange); color: var(--white); }
    .subcat-row.done { color: #00ff66; border-color: #005522; }
    .subcat-name::before { content: "[ ] "; margin-right: 4px; color: var(--gray); }
    .subcat-row.done .subcat-name::before { content: "[*] "; color: var(--yellow); }

    /* Clean Minimal Modals */
    .ut-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .ut-box {
      width: 100%;
      max-width: 390px;
      background: #000;
      border: 2px solid var(--white);
      padding: 8px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin: 4px 0;
    }

    .tab-btn {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #888;
      font-family: var(--font);
      font-size: 0.32rem;
      padding: 4px 1px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      border-color: var(--yellow);
      color: var(--yellow);
      background: #181818;
    }

    .blueprint-ascii {
      background: #030303;
      color: #00ff66;
      font-family: var(--font);
      font-size: 0.31rem;
      padding: 5px;
      border: 1px solid #333;
      white-space: pre;
      line-height: 1.35;
      margin: 4px 0;
      overflow-x: auto;
    }

    .card-block {
      background: #070707;
      border: 1px solid #222;
      padding: 5px;
      margin-bottom: 4px;
      font-size: 0.34rem;
      line-height: 1.5;
    }
    .card-title { color: var(--yellow); margin-bottom: 2px; }
    .card-desc { color: #cccccc; }
    .card-flow { color: #00ffff; font-size: 0.31rem; margin-top: 3px; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Clean Minimal Header -->
    <div class="hud-top">
      <div>LAUNCH: 08.11.2026</div>
      <div id="timer">--:--:--</div>
      <div id="deadline-tag">SAT 24:00</div>
    </div>

    <!-- Arena Canvas -->
    <div id="arena" onclick="pokeFrog()">
      <canvas id="pixelCanvas" width="200" height="130"></canvas>
    </div>

    <!-- Dialogue Box (Clean natural text, no meta labels) -->
    <div id="dialogue-box">
      <div id="dialogue-text" class="dialogue-text">* ...</div>
      <div id="dialogue-choices" class="dialogue-choices" style="display: none;">
        <button id="choice-1" class="choice-btn" onclick="makeChoice(1)">Option A</button>
        <button id="choice-2" class="choice-btn" onclick="makeChoice(2)">Option B</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="status-bar">
      <div>LV <span id="hud-level">1</span></div>
      <div class="hp-box">
        <span>HP</span>
        <div class="hp-bar"><div class="hp-fill"></div></div>
        <span>20/20</span>
      </div>
      <div>EXP <span id="hud-exp" style="color:var(--yellow);">0</span>/5</div>
    </div>

    <!-- Actions -->
    <div class="btn-grid">
      <label for="camera-input" class="btn-action" onclick="playAudioBlip(120)">
        <span>⚔️</span>
        <span>FIGHT</span>
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

      <button class="btn-action" onclick="handleActMenu()">
        <span>🗣</span>
        <span>ACT</span>
      </button>

      <button class="btn-action" onclick="handleItemMenu()">
        <span>🎒</span>
        <span>ITEM</span>
      </button>

      <button class="btn-action" onclick="handleMercyMenu()">
        <span>💔</span>
        <span>MERCY</span>
      </button>
    </div>

    <!-- Curriculum Tray -->
    <div class="tray">
      <div class="nav-row">
        <button id="nav-left" class="nav-btn" onclick="stepTrack(-1)">&lt;</button>
        <div id="track-name" class="track-title">TRACK 1: VALUES (BK 1–13)</div>
        <button id="nav-right" class="nav-btn" onclick="stepTrack(1)">&gt;</button>
      </div>
      <div class="subcat-list" id="subcat-mount"></div>
    </div>
  </div>

  <!-- MODAL: ACT (BLUEPRINT & 25-PAGE DEEP-CUTS) -->
  <div id="blueprint-modal" class="ut-modal">
    <div class="ut-box">
      <div style="font-size:0.38rem; color:var(--yellow); margin-bottom:3px;">* FLOWCHART & 25-PAGE CRITERIA</div>
      <div class="tabs" id="blueprint-tabs"></div>
      <div id="ascii-mount" class="blueprint-ascii"></div>

      <div style="font-size:0.35rem; color:var(--orange); margin:5px 0 3px 0;">
        * 25-PAGE TECHNICAL DISTILLATIONS (~100 WORDS):
      </div>
      <div id="distill-mount"></div>

      <button class="btn-action" style="width:100%; padding:5px; margin-top:5px;" onclick="closeModal('blueprint-modal')">
        * [ RETURN ]
      </button>
    </div>
  </div>

  <!-- MODAL: ITEM -->
  <div id="item-modal" class="ut-modal">
    <div class="ut-box">
      <div style="font-size:0.40rem; color:var(--yellow); margin-bottom:5px;">* INVENTORY</div>
      <div id="items-mount"></div>
      <button class="btn-action" style="width:100%; padding:5px; margin-top:5px;" onclick="closeModal('item-modal')">
        * [ CLOSE ]
      </button>
    </div>
  </div>

  <!-- MODAL: MERCY -->
  <div id="powers-modal" class="ut-modal">
    <div class="ut-box">
      <div style="font-size:0.40rem; color:var(--yellow); margin-bottom:5px;">* POWERS</div>
      <div id="powers-mount" style="font-size:0.34rem; color:#00ff66; line-height:1.6; margin:4px 0;"></div>
      <button class="btn-action" style="width:100%; padding:5px;" onclick="closeModal('powers-modal')">
        * [ BACK ]
      </button>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. CALENDAR & EXPIRATION CLOCK (30 WEEKS, SATURDAY 24:00 DEADLINE)
       ========================================================================= */
    const LAUNCH_DATE = new Date("2026-11-08T00:00:00");
    const TOTAL_WEEKS = 30;
    const GRAND_DEADLINE = new Date(LAUNCH_DATE.getTime() + (TOTAL_WEEKS * 7 * 24 * 60 * 60 * 1000));

    const STATE = {
      activeTrack: 0,
      highestTrack: 0,
      checks: {},
      powers: [],
      inventory: ["Vintage Ketchup"],
      isSleeping: false,
      selectedSubcatIdx: 0,
      animEffect: null,
      animTimer: 0,
      isExploded: false
    };

    try {
      const saved = localStorage.getItem("frog_sans_master_save");
      if (saved) Object.assign(STATE, JSON.parse(saved));
    } catch (e) {}

    function saveState() {
      try { localStorage.setItem("frog_sans_master_save", JSON.stringify(STATE)); } catch (e) {}
    }

    function hardResetExplosion() {
      STATE.isExploded = true;
      triggerVisualAnim("EXPLODE", 180);
      playExplosionSound();
      runTypewriterWithFaces({
        text: "* saturday 24:00 passed. weekly quota missed. froggy has exploded. progress wiped to track 1.",
        facePlan: [{at: 0, f: "EMPTY"}]
      }, () => {
        setTimeout(() => {
          localStorage.removeItem("frog_sans_master_save");
          location.reload();
        }, 4500);
      });
    }

    function updateCalendarSchedule() {
      if (STATE.isExploded) return;
      const now = new Date();
      const diffToLaunch = LAUNCH_DATE - now;
      const diffToSeasonEnd = GRAND_DEADLINE - now;

      if (diffToLaunch > 0 && !sessionStorage.getItem("frog_bypass_active")) {
        document.getElementById("deadline-tag").innerText = "PRE-SEASON";
        const d = Math.floor(diffToLaunch / (1000 * 60 * 60 * 24));
        const h = Math.floor((diffToLaunch / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diffToLaunch / (1000 * 60)) % 60);
        const s = Math.floor((diffToLaunch / 1000) % 60);
        document.getElementById("timer").innerText = `${d}d ${h}h ${m}m ${s}s`;
      } else if (diffToSeasonEnd <= 0) {
        document.getElementById("deadline-tag").innerText = "EXPIRED";
        hardResetExplosion();
      } else {
        const msSinceLaunch = now - LAUNCH_DATE;
        const currentWeekIndex = Math.min(29, Math.floor(msSinceLaunch / (7 * 24 * 60 * 60 * 1000)));

        const weekStartTime = new Date(LAUNCH_DATE.getTime() + (currentWeekIndex * 7 * 24 * 60 * 60 * 1000));
        const weekDeadline = new Date(weekStartTime.getTime() + (6 * 24 * 60 * 60 * 1000) + (23 * 60 * 60 * 1000) + (59 * 60 * 1000) + (59 * 1000));
        const diffWeek = weekDeadline - now;

        document.getElementById("deadline-tag").innerText = `WK ${currentWeekIndex + 1}/30 SAT 24:00`;

        if (diffWeek > 0) {
          const d = Math.floor(diffWeek / (1000 * 60 * 60 * 24));
          const h = Math.floor((diffWeek / (1000 * 60 * 60)) % 24);
          const m = Math.floor((diffWeek / (1000 * 60)) % 60);
          const s = Math.floor((diffWeek / 1000) % 60);
          document.getElementById("timer").innerText = `${d}d ${h}h ${m}m ${s}s`;
        } else {
          const curChecks = STATE.checks[currentWeekIndex + 1] || [];
          if (curChecks.filter(Boolean).length < 5) hardResetExplosion();
        }
      }
    }
    setInterval(updateCalendarSchedule, 1000);
    updateCalendarSchedule();

    /* =========================================================================
       2. WEBAUDIO SOUND SYSTEM
       ========================================================================= */
    let audioContext = null;
    function getAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playSansVoiceBlip() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(82 + (Math.random() * 8), ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    function playAudioBlip(freq = 120) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    function playExplosionSound() {
      try {
        const ctx = getAudio();
        const bufferSize = ctx.sampleRate * 1.5;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.5);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function playVictoryChime() {
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          try {
            const ctx = getAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.07, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.16);
          } catch(e) {}
        }, i * 70);
      });
    }

    function playTrombonePun() {
      const notes = [311.13, 293.66, 277.18, 261.63];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          try {
            const ctx = getAudio();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          } catch(e) {}
        }, i * 190);
      });
    }

    /* =========================================================================
       3. 30 TRACKS & NON-OBVIOUS 25-PAGE DISTILLATIONS (~100 WORDS EACH)
       ========================================================================= */
    const TRACK_NAMES = [
      "Values", "Roles", "Traits", "Framing", "States", "Conversation Loops",
      "Fear", "Anger", "Shame", "Pride", "Desire", "Active Listening",
      "Compliance", "Command", "Biases", "Habit Anchors", "Attention Traps", "Status Shields",
      "Certainty Anchors", "Autonomy Preserves", "Relatedness Ties", "Fairness Audits", "Deception Reads", "Confrontation Defusals",
      "Accusation Cleansers", "Persuasion Primes", "Vulnerability Wedges", "Impression Facades", "Insulation Controls", "System Synthesis"
    ];

    const TRACKS = TRACK_NAMES.map((name, i) => {
      const startBk = 1 + (i * 13);
      const endBk = (i === 29) ? 400 : (13 + (i * 13));

      const subRanges = [
        [startBk, startBk + 2],
        [startBk + 3, startBk + 4],
        [startBk + 5, startBk + 7],
        [startBk + 8, startBk + 9],
        [startBk + 10, endBk]
      ];

      return {
        id: i + 1,
        name: name,
        title: `TRACK ${i + 1}: ${name.toUpperCase()} (BK ${startBk}–${endBk})`,
        powerBadge: `${name} Matrix`,
        parts: subRanges.map((range, pIdx) => {
          const partNames = [
            "Part 1: Signal Identification",
            "Part 2: Leverage Frame Anchor",
            "Part 3: Autonomy Shielding",
            "Part 4: Friction Circuit-Breaker",
            "Part 5: Total Synthesis Matrix"
          ];

          return {
            name: partNames[pIdx],
            booksLabel: `Bk ${range[0]}–${range[1]}`,
            kw: ["laryngeal", "predicate", "convexity", "latency", "refractory"],
            input1: `Acoustic F0 Baseline`,
            input2: `Sensory Predicate Syntax`,
            decision: `Autonomic Shift > Delta?`,
            trueStatement: `Divert to Zero-Demand Query`,
            falseStatement: `Advance Asymmetric Anchor`,
            distillations: [
              {
                pages: `Pages 1–25: Laryngeal Tension & Acoustic F0 Shifts`,
                text: `When deception or stress begins, the cricothyroid muscle involuntarily tightens, shifting vocal fundamental frequency (F0) upward by 8 to 14 Hz prior to conscious syntax formulation. Counter-arguments delivered during this autonomic refractory interval are registered by the ventral striatum as predatory territorial threats rather than data. Your flowchart Input Node must track acoustic frequency baseline and gaze aversion delta. If the shift exceeds threshold, divert logic to zero-demand inquiry; never confront directly.`,
                node: `[Input: Acoustic F0 Delta] -> (Elevated > 10Hz?) -> [Zero-Demand Query]`
              },
              {
                pages: `Pages 26–50: Sensory Predicate Synchronization`,
                text: `Counterparts process high-stakes friction through sensory-specific verbal predicates: auditory, kinesthetic, or visual. Introducing abstract logical propositions while the interlocutor is locked in a kinesthetic processing loop triggers immediate cognitive rejection. Your decision diamond must verify whether two consecutive turns matched their sensory predicate structure. If true, introduce the re-anchored constraint; if false, loop execution backward into sensory mirroring before advancing.`,
                node: `[Decision: 2 Predicate Turns Aligned?] -> (Yes) -> [Deploy Pivot]`
              },
              {
                pages: `Pages 51–75: Prospect Loss Convexity & Boundary Structuring`,
                text: `Kahneman-Tversky value function convexity dictates that subjects willingly incur an 80% probability of greater future loss to avoid a certain 100% immediate concession. Never construct flowcharts that demand mutual compromise; compromise triggers loss aversion. Structure choices so the non-chosen path represents unhedged status exposure and the chosen path represents downside insulation. If the condition diamond confirms immediate exposure is eliminated, advance to closure.`,
                node: `[Decision: Exposure Shielded?] -> (Yes) -> [Advance to Closure]`
              },
              {
                pages: `Pages 76–100: Terminal Verification & Latency Calibration`,
                text: `Compliance feigning occurs when an interlocutor accepts terms in under 1.2 seconds without cognitive retrieval latency. Genuine consensus requires a minimum 2.5-second processing pause followed by active semantic restructuring of terms. The terminal node of your flowchart must mandate active playback: the counterpart must restate the execution milestones in their own words. If playback is absent, branch execution back to the diagnostic challenge.`,
                node: `[Terminal: Active Verbal Playback Logged?] -> (Yes) -> [Seal Agreement]`
              }
            ]
          };
        })
      };
    });

    function buildCustomFlowchartASCII(trackName, sub) {
      return `   +------------------------------------+
   |              ( START )             |
   +-----------------+------------------+
                     |
                     v
   /------------------------------------\\
  /  [/ INPUT 1 /]:                      \\
 /   ${sub.input1.padEnd(34, ' ')} /
+------------------------------------+
                     |
                     v
   /------------------------------------\\
  /  [/ INPUT 2 /]:                      \\
 /   ${sub.input2.padEnd(34, ' ')} /
+------------------------------------+
                     |
                     v
             /\\                
            /  \\               
           /    \\              
    < ${sub.decision.padEnd(20, ' ')} >
           \\    /              
            \\  /   --[ True ]-->+----------------------------------+
             \\/                 | [/ STATEMENT 2 /]:               |
             |                  | ${sub.trueStatement.padEnd(32, ' ')} |
          [ False ]             +----------------+-----------------+
             |                                   |
             v                                   |
+----------------------------------+             |
| [/ STATEMENT 1 /]:               |             |
| ${sub.falseStatement.padEnd(32, ' ')} |             |
+----------------+-----------------+             |
                 |                               |
                 +---------------+---------------+
                                 |
                                 v
   +-----------------------------+------+
   |               ( STOP )             |
   +------------------------------------+
   * TRACK: ${trackName} | ${sub.booksLabel}`;
    }

    /* =========================================================================
       4. CANVAS RENDERING ENGINE
       ========================================================================= */
    const canvas = document.getElementById("pixelCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const frog = {
      x: 88,
      y: 72,
      targetX: 88,
      facing: 1,
      state: "IDLE",
      face: "GRIN",
      timer: 0,
      animFrame: 0,
      isMouthOpen: false,
      hat: null
    };

    const P = {
      black: "#000000",
      outline: "#15181f",
      greenDark: "#025433",
      greenMain: "#00a86b",
      greenBright: "#00e699",
      pinkTrim: "#ff597b",
      skin: "#fcd5a0",
      bellyYellow: "#fce373",
      bellyPink: "#e83a82",
      white: "#ffffff",
      gridGreen: "#00662a"
    };

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function renderScene() {
      let shakeX = 0, shakeY = 0;
      if (STATE.animTimer > 0) {
        STATE.animTimer--;
        if (STATE.animEffect === "EXPLODE" || STATE.animEffect === "SHAKE") {
          shakeX = (Math.random() - 0.5) * 8;
          shakeY = (Math.random() - 0.5) * 8;
        }
      } else {
        if (STATE.animEffect !== "EXPLODE") STATE.animEffect = null;
      }

      ctx.save();
      ctx.translate(shakeX, shakeY);

      ctx.fillStyle = "#000000";
      ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

      ctx.strokeStyle = (STATE.animEffect === "EXPLODE") ? "#ff0000" : P.gridGreen;
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Bookshelf
      drawPixelRect(8, 60, 24, 48, P.black);
      ctx.strokeStyle = P.white;
      ctx.strokeRect(8, 60, 24, 48);
      drawPixelRect(11, 65, 18, 5, "#ff4757");
      drawPixelRect(11, 74, 18, 5, "#00a86b");
      drawPixelRect(11, 83, 18, 5, "#fce373");
      drawPixelRect(11, 92, 18, 5, "#ff597b");

      if (STATE.highestTrack >= 1) {
        drawPixelRect(150, 84, 42, 24, P.black);
        ctx.strokeRect(150, 84, 42, 24);
        drawPixelRect(156, 76, 8, 8, P.white);
      }

      if (STATE.animEffect === "EXPLODE") {
        for (let i = 0; i < 24; i++) {
          const ox = frog.x + Math.sin(i * 1.5) * (Math.random() * 45);
          const oy = frog.y + Math.cos(i * 1.5) * (Math.random() * 45);
          drawPixelRect(ox, oy, 3, 3, (i % 2 === 0) ? "#ff0000" : "#ffff00");
        }
      } else if (STATE.isSleeping) {
        drawPixelRect(80, 80, 48, 26, P.black);
        ctx.strokeStyle = P.white;
        ctx.strokeRect(80, 80, 48, 26);
        drawPixelRect(83, 76, 12, 8, P.white);
        drawPixelRect(92, 78, 14, 12, P.greenMain);
        drawPixelRect(94, 82, 3, 1, P.black);
        drawPixelRect(100, 82, 3, 1, P.black);
        drawPixelRect(96, 80, 30, 24, P.pinkTrim);
      } else {
        renderFrogSprite(frog.x, frog.y, frog.face, frog.animFrame, frog.isMouthOpen);
      }

      ctx.restore();
      requestAnimationFrame(renderScene);
    }

    function renderFrogSprite(fx, fy, face, frame, mouthOpen) {
      const legOffset = (frog.state === "WALK") ? (Math.floor(frame / 6) % 2 === 0 ? 2 : -2) : 0;
      const shrugOffset = (face === "SHRUG") ? -3 : 0;

      drawPixelRect(fx, fy + shrugOffset, 26, 36, P.outline);
      drawPixelRect(fx + 2, fy + 2 + shrugOffset, 22, 32, P.greenMain);
      drawPixelRect(fx + 2, fy + 2 + shrugOffset, 6, 32, P.greenDark);
      drawPixelRect(fx + 10, fy + 2 + shrugOffset, 12, 32, P.greenBright);

      drawPixelRect(fx + 3, fy - 6 + shrugOffset, 7, 7, P.white);
      drawPixelRect(fx + 16, fy - 6 + shrugOffset, 7, 7, P.white);

      if (face === "EMPTY") {
        drawPixelRect(fx + 3, fy - 6 + shrugOffset, 7, 7, P.black);
        drawPixelRect(fx + 16, fy - 6 + shrugOffset, 7, 7, P.black);
      } else {
        drawPixelRect(fx + 5, fy - 4 + shrugOffset, 3, 3, P.black);
        drawPixelRect(fx + 18, fy - 4 + shrugOffset, 3, 3, P.black);
      }

      drawPixelRect(fx + 4, fy + 6 + shrugOffset, 18, 15, P.pinkTrim);
      drawPixelRect(fx + 6, fy + 8 + shrugOffset, 14, 11, P.skin);

      if (face === "EMPTY") {
        drawPixelRect(fx + 8, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      } else if (face === "WINK") {
        drawPixelRect(fx + 8, fy + 11 + shrugOffset, 4, 2, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      } else if (face === "DERP") {
        drawPixelRect(fx + 6, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 13, fy + 10 + shrugOffset, 3, 4, P.black);
      } else {
        drawPixelRect(fx + 8, fy + 10 + shrugOffset, 3, 4, P.black);
        drawPixelRect(fx + 15, fy + 10 + shrugOffset, 3, 4, P.black);
      }

      drawPixelRect(fx + 5, fy + 14 + shrugOffset, 2, 2, P.pinkTrim);
      drawPixelRect(fx + 19, fy + 14 + shrugOffset, 2, 2, P.pinkTrim);

      if (mouthOpen) {
        drawPixelRect(fx + 11, fy + 16 + shrugOffset, 5, 3, P.black);
      } else {
        drawPixelRect(fx + 10, fy + 17 + shrugOffset, 7, 1, P.black);
      }

      drawPixelRect(fx + 5, fy + 22 + shrugOffset, 16, 11, P.bellyYellow);
      drawPixelRect(fx + 10, fy + 24 + shrugOffset, 6, 6, P.bellyPink);

      if (face === "SHRUG") {
        drawPixelRect(fx - 4, fy + 16, 5, 6, P.greenMain);
        drawPixelRect(fx + 25, fy + 16, 5, 6, P.greenMain);
      }

      drawPixelRect(fx + 3, fy + 35 + legOffset, 7, 3, P.greenDark);
      drawPixelRect(fx + 16, fy + 35 - legOffset, 7, 3, P.greenDark);
    }

    function triggerVisualAnim(type, frames = 90) {
      STATE.animEffect = type;
      STATE.animTimer = frames;
    }

    function updateWanderingAI() {
      if (STATE.isSleeping || STATE.isExploded) return;
      frog.timer++;
      frog.animFrame++;

      if (frog.state === "IDLE") {
        if (frog.timer > 120) {
          frog.targetX = 35 + Math.floor(Math.random() * 115);
          frog.state = "WALK";
          frog.facing = (frog.targetX > frog.x) ? 1 : -1;
          frog.timer = 0;
        }
      } else if (frog.state === "WALK") {
        const dx = frog.targetX - frog.x;
        if (Math.abs(dx) <= 1) {
          frog.x = frog.targetX;
          frog.state = "IDLE";
          frog.timer = 0;
        } else {
          frog.x += Math.sign(dx) * 0.75;
        }
      }
    }
    setInterval(updateWanderingAI, 30);
    renderScene();

    /* =========================================================================
       5. NATURAL DIALOGUE (NATURAL DEADPAN & NATURAL VULNERABLE)
       ========================================================================= */
    const SANS_BANTER = [
      {
        text: "* 30 weeks total, ending 06.06.2027. clear the track by saturday 24:00 or i turn into fireworks.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 20, f: "WINK"}, {at: 55, f: "SHRUG"} ],
        c1: "i am taking career advice from an 8-bit amphibian. my family must be thrilled.",
        r1: "* at least i don't charge two hundred an hour to tell you to breathe. check act and draw the nodes.",
        c2: "what if i put all this work in and people still misunderstand me?",
        r2: "* ...look, kiddo. being misunderstood is part of breathing. but learning this isn't about being bulletproof. it's about not feeling helpless when things get loud. you're doing fine."
      },
      {
        text: "* people will spend four hours arguing over dishes rather than admit they feel unappreciated.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 25, f: "DERP"}, {at: 60, f: "EMPTY"} ],
        c1: "if i slide you a ketchup bottle, can we just pretend i mastered this track?",
        r1: "* bribery is a bold diagnostic strategy. unfortunately, neural ocr doesn't accept condiments. draw the nodes, pal.",
        c2: "it feels exhausting having to measure every single syllable just to avoid conflict.",
        r2: "* i know, kiddo. it's heavy having to walk on eggshells. but once these frameworks become muscle memory, you won't be measuring out of fear anymore. you'll just be clear."
      },
      {
        text: "* you're staring at a glass rectangle in your room while a pixel frog evaluates your paper notes.",
        facePlan: [ {at: 0, f: "GRIN"}, {at: 30, f: "WINK"}, {at: 70, f: "SHRUG"} ],
        c1: "you're just stalling so you don't have to get a real job in Snowdin.",
        r1: "* words cut deeper than swords, kiddo. luckily my hitbox is immune to insults. hit [ FIGHT ] and show me your work.",
        c2: "sometimes it feels like everyone got a manual on how to talk to people except me.",
        r2: "* kiddo... nobody got the manual. everybody out there is just improvising and bumping into walls. that's why these books exist: to give you the blueprint everyone else pretends they already know."
      }
    ];

    let currentBanterIdx = 0;
    let typeTimer = null;

    function runTypewriterWithFaces(item, onDone) {
      const box = document.getElementById("dialogue-text");
      box.innerHTML = "";
      clearTimeout(typeTimer);
      let i = 0;
      const fullText = item.text;
      const plan = item.facePlan || [{at: 0, f: "GRIN"}];

      function step() {
        if (i < fullText.length) {
          plan.forEach(p => {
            if (i === p.at) frog.face = p.f;
          });

          box.innerHTML += fullText.charAt(i);

          if (/[a-zA-Z0-9]/.test(fullText.charAt(i))) {
            playSansVoiceBlip();
            frog.isMouthOpen = !frog.isMouthOpen;
          }

          i++;
          typeTimer = setTimeout(step, 24);
        } else {
          frog.isMouthOpen = false;
          frog.face = "GRIN";
          if (onDone) onDone();
        }
      }
      step();
    }

    function triggerDialogue(idx) {
      currentBanterIdx = idx % SANS_BANTER.length;
      const b = SANS_BANTER[currentBanterIdx];
      const choices = document.getElementById("dialogue-choices");
      choices.style.display = "none";

      runTypewriterWithFaces(b, () => {
        document.getElementById("choice-1").innerText = b.c1;
        document.getElementById("choice-2").innerText = b.c2;
        choices.style.display = "flex";
      });
    }

    function makeChoice(opt) {
      playAudioBlip(320);
      const b = SANS_BANTER[currentBanterIdx];
      const reply = (opt === 1) ? b.r1 : b.r2;
      document.getElementById("dialogue-choices").style.display = "none";

      if (reply.includes("condiments") || reply.includes("fireworks")) {
        setTimeout(playTrombonePun, 600);
      }

      runTypewriterWithFaces({
        text: reply,
        facePlan: (opt === 1) ? [{at: 0, f: "WINK"}, {at: 30, f: "DERP"}, {at: 60, f: "GRIN"}] : [{at: 0, f: "EMPTY"}, {at: 40, f: "GRIN"}]
      });
    }

    function pokeFrog() {
      playAudioBlip(440);
      triggerDialogue(Math.floor(Math.random() * SANS_BANTER.length));
    }

    /* =========================================================================
       6. ACT MENU & DISTILLATIONS
       ========================================================================= */
    function handleActMenu(subIndex = 0) {
      playAudioBlip(380);
      const curTrack = TRACKS[STATE.activeTrack];
      STATE.selectedSubcatIdx = subIndex;

      const tabsMount = document.getElementById("blueprint-tabs");
      tabsMount.innerHTML = "";

      curTrack.parts.forEach((p, idx) => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${idx === STATE.selectedSubcatIdx ? 'active' : ''}`;
        btn.innerText = `P${idx + 1}`;
        btn.onclick = () => {
          playAudioBlip(240);
          handleActMenu(idx);
        };
        tabsMount.appendChild(btn);
      });

      const selectedPart = curTrack.parts[STATE.selectedSubcatIdx];
      document.getElementById("ascii-mount").innerText = buildCustomFlowchartASCII(curTrack.name, selectedPart);

      const distillMount = document.getElementById("distill-mount");
      distillMount.innerHTML = "";
      selectedPart.distillations.forEach(d => {
        const div = document.createElement("div");
        div.className = "card-block";
        div.innerHTML = `
          <div class="card-title">* ${d.pages}</div>
          <div class="card-desc">${d.text}</div>
          <div class="card-flow">NODE: ${d.node}</div>
        `;
        distillMount.appendChild(div);
      });

      document.getElementById("blueprint-modal").style.display = "flex";
    }

    function handleItemMenu() {
      playAudioBlip(350);
      const mount = document.getElementById("items-mount");
      mount.innerHTML = "";

      STATE.inventory.forEach(item => {
        const div = document.createElement("div");
        div.className = "subcat-row";
        div.innerHTML = `<span>* ${item}</span><span style="color:var(--orange);">[USE]</span>`;
        div.onclick = () => {
          closeModal("item-modal");
          playAudioBlip(420);
          runTypewriterWithFaces({ text: `* used ${item}. classic comfort item.`, facePlan: [{at: 0, f: "GRIN"}] });
        };
        mount.appendChild(div);
      });

      document.getElementById("item-modal").style.display = "flex";
    }

    function handleMercyMenu() {
      playAudioBlip(280);
      document.getElementById("powers-mount").innerHTML = STATE.powers.length
        ? STATE.powers.map(p => `<div>* ${p}</div>`).join('')
        : "<div>* no powers yet. clear a track 5/5 first.</div>";
      document.getElementById("powers-modal").style.display = "flex";
    }

    function closeModal(id) {
      playAudioBlip(220);
      document.getElementById(id).style.display = "none";
    }

    /* =========================================================================
       7. PROGRESSION
       ========================================================================= */
    function stepTrack(delta) {
      const next = STATE.activeTrack + delta;
      if (next < 0) return;
      if (next > STATE.highestTrack) {
        playAudioBlip(140);
        runTypewriterWithFaces({
          text: "* track locked. finish current track before saturday 24:00.",
          facePlan: [{at: 0, f: "EMPTY"}]
        });
        return;
      }
      playAudioBlip(320);
      STATE.activeTrack = next;
      STATE.isSleeping = false;
      saveState();
      refreshUI();
      runTypewriterWithFaces({
        text: `* loaded ${TRACKS[STATE.activeTrack].title}. study the 25-page nodes in act.`,
        facePlan: [{at: 0, f: "GRIN"}]
      });
    }

    function refreshUI() {
      const cur = TRACKS[STATE.activeTrack];
      document.getElementById("track-name").innerText = (STATE.activeTrack > STATE.highestTrack) ? `🔒 ${cur.title}` : cur.title;
      document.getElementById("nav-left").disabled = (STATE.activeTrack === 0);
      document.getElementById("nav-right").disabled = (STATE.activeTrack >= TRACKS.length - 1);

      if (!STATE.checks[cur.id]) STATE.checks[cur.id] = [false, false, false, false, false];
      const c = STATE.checks[cur.id];
      const done = c.filter(Boolean).length;

      document.getElementById("hud-level").innerText = STATE.activeTrack + 1;
      document.getElementById("hud-exp").innerText = done;

      const mount = document.getElementById("subcat-mount");
      mount.innerHTML = "";
      cur.parts.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = `subcat-row ${c[idx] ? 'done' : ''}`;
        item.innerHTML = `
          <span class="subcat-name">${p.name}</span>
          <span style="color:#ff9900;">${p.booksLabel}</span>
        `;
        item.onclick = () => handleActMenu(idx);
        mount.appendChild(item);
      });
    }

    /* =========================================================================
       8. OCR VERIFICATION
       ========================================================================= */
    const cameraInput = document.getElementById("camera-input");
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      playAudioBlip(440);
      runTypewriterWithFaces({
        text: "* scanning paper flowchart against 25-page technical criteria...",
        facePlan: [{at: 0, f: "DERP"}]
      });

      if (!window.Tesseract) {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = () => runOCR(file);
        document.body.appendChild(s);
      } else {
        runOCR(file);
      }
    });

    async function runOCR(file) {
      try {
        const worker = await Tesseract.createWorker('eng');
        const res = await worker.recognize(file);
        const text = res.data.text.toLowerCase().trim();
        await worker.terminate();

        const cur = TRACKS[STATE.activeTrack];
        const checks = STATE.checks[cur.id];
        let found = 0;
        let missingParts = [];

        const hasArrows = text.includes("->") || text.includes("-->") || text.includes("=>") || text.includes("to") || text.includes(">");

        cur.parts.forEach((part, idx) => {
          if (!checks[idx]) {
            const hasKeyword = part.kw.some(k => text.includes(k));
            if (hasArrows && hasKeyword) {
              checks[idx] = true;
              found++;
            } else {
              missingParts.push({ partIdx: idx + 1, name: part.name, label: part.booksLabel });
            }
          }
        });

        const total = checks.filter(Boolean).length;

        if (total === 5) {
          playVictoryChime();
          STATE.isSleeping = true;
          if (!STATE.powers.includes(cur.powerBadge)) STATE.powers.push(cur.powerBadge);
          if (STATE.highestTrack === STATE.activeTrack) STATE.highestTrack++;

          runTypewriterWithFaces({
            text: `* 5/5 verified! [${cur.powerBadge}] unlocked. track safely cleared before saturday midnight.`,
            facePlan: [{at: 0, f: "WINK"}, {at: 40, f: "GRIN"}]
          });
        } else if (!hasArrows) {
          triggerVisualAnim("SHAKE", 60);
          playAudioBlip(100);
          runTypewriterWithFaces({
            text: "* miss. no connector arrows (->) detected. connect your nodes.",
            facePlan: [{at: 0, f: "DERP"}]
          });
        } else if (found > 0) {
          playVictoryChime();
          const nextFail = missingParts[0];
          runTypewriterWithFaces({
            text: `* verified ${found} node(s) (${total}/5 complete). Part ${nextFail.partIdx} (${nextFail.label}) is missing. inspect act.`,
            facePlan: [{at: 0, f: "GRIN"}]
          });
        } else {
          triggerVisualAnim("SHAKE", 60);
          const firstFail = missingParts[0];
          runTypewriterWithFaces({
            text: `* miss on Part ${firstFail.partIdx} (${firstFail.label}). missing technical logic. review act tab.`,
            facePlan: [{at: 0, f: "EMPTY"}]
          });
        }

        saveState();
        refreshUI();
      } catch (err) {
        runTypewriterWithFaces({
          text: "* error reading paper. hold camera steady with clean lighting.",
          facePlan: [{at: 0, f: "SHRUG"}]
        });
      }
    }

    refreshUI();
    triggerDialogue(0);
  </script>
</body>
